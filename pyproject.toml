[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webrecon"
version = "0.1.0"
description = "WebRecon — local-first Website Intelligence & Security Assessment workstation (passive, scope-enforced, non-destructive)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WebRecon contributors" }]
keywords = ["security", "recon", "osint", "web", "assessment", "pentest", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Network/scanning engine deps (added as their phases land).
engine = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "aiolimiter>=1.1",
    "dnspython>=2.6",
    "cryptography>=42.0",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]
browser = ["playwright>=1.44"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "websockets>=12.0"]
report = ["jinja2>=3.1"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/webrecon/webrecon"
Documentation = "https://github.com/webrecon/webrecon/tree/main/docs"
Issues = "https://github.com/webrecon/webrecon/issues"

[project.scripts]
webrecon = "webrecon.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webrecon"]
# Ship type information (PEP 561) and the bundled dashboard asset.
artifacts = ["src/webrecon/py.typed", "src/webrecon/api/static/*"]

[tool.coverage.run]
source = ["webrecon"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# S101 (assert) is fine in tests; per-file-ignores below.
ignore = [
    "B008",   # typer uses function calls in argument defaults
    "UP042",  # custom str+Enum base (StrEnum) is intentional for explicit values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# The HTML report is one big embedded template string; long CSS/markup lines are fine.
"src/webrecon/reporting/html_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
