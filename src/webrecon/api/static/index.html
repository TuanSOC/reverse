<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRecon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Ctext x='16' y='22' font-size='18' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%234da3ff'%3EW%3C/text%3E%3C/svg%3E">
<style>
  /* ---- design tokens (dark default, light override) ---- */
  :root{
    --bg:#0b0e14; --panel:#11151f; --panel2:#161b26; --panel3:#1b2130; --border:#232a38;
    --fg:#d7dce5; --muted:#8a93a6; --faint:#5b6472; --accent:#4da3ff; --accent2:#7c5cff;
    --crit:#ff4d6d; --high:#ff784e; --med:#f2c14e; --low:#4dd0e1; --info:#6b7280; --ok:#3ddc97;
    --shadow:0 12px 40px rgba(0,0,0,.5); --radius:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  :root[data-theme="light"]{
    --bg:#f5f7fb; --panel:#ffffff; --panel2:#f0f3f9; --panel3:#e8edf5; --border:#dde3ec;
    --fg:#1a1f2b; --muted:#5b6472; --faint:#8a93a6; --accent:#2f6fe0; --accent2:#6a4bff;
    --crit:#c1123c; --high:#d1552b; --med:#a5820f; --low:#0e7490; --info:#6b7280; --ok:#0f9d6b;
    --shadow:0 12px 40px rgba(20,30,60,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  button,select,input{font:inherit;color:var(--fg);background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:7px 11px;transition:.12s}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;
    border:0;font-weight:700} button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent} button.icon{padding:7px 9px;background:transparent}
  button.danger{background:transparent;border-color:#5a2530;color:var(--crit)}
  .app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--panel);border-bottom:1px solid var(--border);z-index:20}
  .brand{font-weight:800;letter-spacing:1px;font-size:15px;user-select:none}
  .brand span{color:var(--accent)} .spacer{flex:1}
  select#scanSelect{max-width:400px}
  .kbd{font:11px var(--mono);background:var(--panel2);border:1px solid var(--border);
    border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--muted)}
  nav{background:var(--panel);border-right:1px solid var(--border);padding:12px 10px;overflow:auto}
  nav .grp{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;
    margin:15px 10px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;
    color:var(--muted);cursor:pointer;font-size:13.5px;position:relative}
  nav a .ic{width:7px;height:7px;border-radius:2px;background:var(--faint);transition:.15s}
  nav a.active{background:var(--panel3);color:var(--fg)} nav a.active .ic{background:var(--accent)}
  nav a:hover{background:var(--panel2);color:var(--fg)} nav a .badge{margin-left:auto;
    font:11px var(--mono);color:var(--faint)}
  main{overflow:auto;padding:22px 26px;position:relative}
  h1{font-size:21px;margin:0 0 3px} .sub{color:var(--muted);font-size:13px}
  h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:26px 0 10px}
  .fade{animation:fade .25s ease} @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  /* cards + hero */
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;min-width:110px}
  .card .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:24px;font-weight:800;margin-top:6px}
  .riskhero{display:flex;align-items:center;gap:18px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin:16px 0}
  .riskbadge{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    padding:9px 16px;border-radius:10px;color:#fff}
  /* tables */
  table{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    position:sticky;top:0;background:var(--bg);z-index:1}
  tbody tr{cursor:pointer;transition:.1s} tbody tr:hover td{background:var(--panel)}
  tbody tr.clickable td:last-child::after{content:"›";color:var(--faint);float:right}
  code,.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .b-critical,.pill.critical{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
  .b-high,.pill.high{background:color-mix(in srgb,var(--high) 18%,transparent);color:var(--high)}
  .b-medium,.pill.medium{background:color-mix(in srgb,var(--med) 18%,transparent);color:var(--med)}
  .b-low,.pill.low{background:color-mix(in srgb,var(--low) 18%,transparent);color:var(--low)}
  .b-informational,.pill.informational{background:color-mix(in srgb,var(--info) 24%,transparent);color:var(--muted)}
  .obs-observed{color:var(--ok);font-weight:600}.obs-referenced{color:var(--accent)}.obs-potential{color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .toolbar input{min-width:240px}
  .chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border);cursor:pointer;
    font-size:12px;color:var(--muted);background:var(--panel2);user-select:none}
  .chip.on{color:#fff;border-color:transparent}
  .chip.critical.on{background:var(--crit)}.chip.high.on{background:var(--high)}
  .chip.medium.on{background:var(--med);color:#04101f}.chip.low.on{background:var(--low);color:#04101f}
  .chip.informational.on{background:var(--info)}
  /* findings */
  .finding{border:1px solid var(--border);border-radius:10px;margin:9px 0;overflow:hidden;background:var(--panel)}
  .finding>.head{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}
  .finding>.head:hover{background:var(--panel2)}
  .finding .body{padding:0 14px 14px;border-top:1px solid var(--border);display:none}
  .finding.open .body{display:block;animation:fade .2s}
  .finding .name{font-weight:600}.kv{color:var(--muted);font-size:12px}
  .evi{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    margin-top:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .empty .big{font-size:34px;opacity:.5} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  /* skeleton */
  .sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel3) 37%,var(--panel2) 63%);
    background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:6px;height:14px;margin:8px 0}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  /* progress */
  .prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .bar{width:170px;height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.ok{background:var(--ok)}.dot.run{background:var(--med);animation:pulse 1s infinite}.dot.fail{background:var(--crit)}
  @keyframes pulse{50%{opacity:.35}}
  .modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
  .modcell{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);
    border-radius:8px;font-size:12px;background:var(--panel)}
  .shot{max-width:320px;border:1px solid var(--border);border-radius:10px;cursor:zoom-in;transition:.15s}
  .shot:hover{filter:brightness(1.05)}
  /* charts */
  .charts{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:8px 0}
  svg text{fill:var(--fg)}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,94vw);background:var(--panel);
    border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer .dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
  .drawer .dhead .t{font-weight:700;font-size:15px} .drawer .dbody{overflow:auto;padding:16px 18px}
  .dsec{margin-bottom:18px} .dsec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:0 0 8px}
  .drow{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .drow .dk{color:var(--muted)} .drow .dv{word-break:break-word}
  .taglist{display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--panel2);border:1px solid var(--border);
    border-radius:6px;padding:2px 8px;font:11px var(--mono)}
  /* toast + palette + dialog */
  #toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);animation:fade .2s;font-size:13px;max-width:340px}
  .toast.err{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--ok)}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:14px;
    padding:22px;width:min(480px,94vw);box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px}
  dialog input[type=text],dialog input[type=number],dialog select{width:100%}
  .check{display:flex;align-items:center;gap:9px;margin:9px 0}.check input{width:auto}
  #palette{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
    background:rgba(0,0,0,.5);z-index:70;padding-top:12vh}
  #palette.on{display:flex}
  .palbox{width:min(560px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden}
  .palbox input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px}
  .palresults{max-height:340px;overflow:auto}
  .palitem{padding:10px 16px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .palitem.sel,.palitem:hover{background:var(--panel3)} .palitem .hint{margin-left:auto;color:var(--faint);font-size:12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  iframe.preview{width:100%;height:520px;border:1px solid var(--border);border-radius:10px;background:#fff}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px}
  .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .add{color:var(--ok)}.rem{color:var(--crit)} .diffcol h2{margin-top:8px}
  .copy{cursor:pointer;color:var(--muted);font-size:11px;margin-left:6px}.copy:hover{color:var(--accent)}
</style>
<style id="premium">
  /* ===================== premium override layer ===================== */
  :root{
    --bg:#080b11; --panel:#0f1420; --panel2:#141a28; --panel3:#1b2334; --border:#222c40;
    --fg:#e6eaf2; --muted:#8b95ac; --faint:#5b6479; --accent:#5aa2ff; --accent2:#9b6bff;
    --ok:#37e0a6; --shadow:0 18px 50px -12px rgba(0,0,0,.65); --radius:14px;
    --grad:linear-gradient(120deg,var(--accent),var(--accent2));
    --ring:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);
  }
  :root[data-theme="light"]{
    --bg:#eef2f9; --panel:#ffffff; --panel2:#f3f6fc; --panel3:#e9eff8; --border:#dfe6f1;
    --fg:#0f1729; --muted:#5a6478; --faint:#8a94a8; --accent:#2f6fe0; --accent2:#7a4bff;
    --shadow:0 18px 50px -14px rgba(30,45,80,.22);
  }
  body{background:
    radial-gradient(1100px 520px at 82% -8%, color-mix(in srgb,var(--accent2) 16%,transparent), transparent 60%),
    radial-gradient(900px 480px at -6% 4%, color-mix(in srgb,var(--accent) 13%,transparent), transparent 55%),
    var(--bg);
    -webkit-font-smoothing:antialiased;letter-spacing:.1px}
  ::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--border)}
  /* header — glass */
  header{background:color-mix(in srgb,var(--panel) 78%,transparent);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid var(--border);box-shadow:0 1px 0 color-mix(in srgb,#fff 5%,transparent) inset}
  .brand{font-size:16px}
  .brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  header::before{content:"";width:26px;height:26px;border-radius:8px;background:var(--grad);
    box-shadow:0 6px 18px -6px var(--accent);margin-right:2px;flex:0 0 auto;
    -webkit-mask:linear-gradient(#000,#000);position:relative}
  /* buttons + inputs */
  button,select,input{border-radius:10px;transition:.16s cubic-bezier(.2,.7,.2,1)}
  button:hover{transform:translateY(-1px)}
  button.primary{box-shadow:0 8px 22px -8px var(--accent)}
  button.icon{border:1px solid var(--border);border-radius:10px;font-size:13px;opacity:.9}
  button.icon:hover{opacity:1;border-color:var(--accent)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
  select#scanSelect{background:var(--panel2);border-radius:10px}
  /* sidebar */
  nav{background:color-mix(in srgb,var(--panel) 60%,transparent);backdrop-filter:blur(8px)}
  nav .grp{font-weight:700}
  nav a{border-radius:10px;font-weight:500;transition:.15s}
  nav a svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;opacity:.85}
  nav a.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 20%,transparent),transparent);
    color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
  nav a.active::before{content:"";position:absolute;left:-2px;top:18%;bottom:18%;width:3px;border-radius:3px;background:var(--grad)}
  nav a.active svg{opacity:1;color:var(--accent)}
  nav a .badge{background:var(--panel3);border-radius:999px;padding:1px 8px;font-weight:600}
  nav a .ic{display:none}
  /* headings */
  h1{font-weight:800;letter-spacing:-.02em;font-size:22px}
  h2{color:var(--faint)}
  /* cards + risk hero */
  .card{border-radius:var(--radius);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,#fff 3%),var(--panel));
    box-shadow:var(--shadow);transition:.18s} .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
  .card .v{letter-spacing:-.02em}
  .riskhero{border-radius:18px;background:
    radial-gradient(120% 160% at 0% 0%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 45%),
    linear-gradient(180deg,color-mix(in srgb,var(--panel) 90%,#fff 4%),var(--panel));
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .riskbadge{border-radius:12px;box-shadow:0 10px 30px -10px currentColor;position:relative}
  .riskbadge::after{content:"";position:absolute;inset:0;border-radius:12px;
    box-shadow:0 0 0 1px color-mix(in srgb,#fff 30%,transparent) inset}
  /* pills + tags */
  .pill{border:1px solid color-mix(in srgb,currentColor 22%,transparent);font-weight:700}
  .tag{background:var(--panel3);border-radius:8px}
  /* tables */
  table{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:color-mix(in srgb,var(--panel) 70%,transparent)}
  th{background:color-mix(in srgb,var(--panel3) 80%,transparent);border-bottom:1px solid var(--border);backdrop-filter:blur(6px)}
  td{border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
  tbody tr{transition:background .12s} tbody tr:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  tbody tr.clickable:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  code{color:color-mix(in srgb,var(--accent) 78%,var(--fg))}
  /* finding cards */
  .finding{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 94%,#fff 2%),var(--panel));
    border-radius:12px;box-shadow:0 6px 18px -12px rgba(0,0,0,.6);transition:.15s}
  .finding:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--border))}
  .finding>.head{padding:12px 15px}
  .evi{border-radius:10px;background:color-mix(in srgb,var(--panel3) 60%,transparent)}
  /* chips */
  .chip{border-radius:999px;transition:.14s} .chip:hover{border-color:var(--accent);color:var(--fg)}
  /* drawer + dialog + palette — glass + spring */
  .drawer{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(20px) saturate(1.3);
    border-left:1px solid color-mix(in srgb,var(--accent) 18%,var(--border))}
  .drawer .dhead{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent)}
  .drawer .dhead .t{font-weight:800;letter-spacing:-.01em}
  .drow{grid-template-columns:120px 1fr} .drow .dk{font-weight:600}
  dialog{border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  dialog::backdrop{backdrop-filter:blur(4px)}
  .palbox{border-radius:16px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 20%,var(--border))}
  .palitem.sel{box-shadow:inset 2px 0 0 var(--accent)}
  .toast{border-radius:12px;backdrop-filter:blur(10px)}
  /* progress */
  .bar{height:7px;border-radius:6px;box-shadow:inset 0 0 0 1px color-mix(in srgb,#fff 6%,transparent)}
  .bar>i{box-shadow:0 0 12px -2px var(--accent)}
  /* screenshot + iframe */
  .shot{border-radius:12px;box-shadow:var(--shadow)}
  iframe.preview{border-radius:12px;box-shadow:var(--shadow)}
  /* fancy empty */
  .empty .big{font-size:40px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.6}
  /* entrance animation */
  .fade{animation:rise .32s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* responsive: collapse sidebar labels on narrow screens */
  @media (max-width:860px){
    .app{grid-template-columns:60px 1fr}
    nav a span:not(.badge):not(.navic){display:none} nav .grp{text-align:center;font-size:9px}
    nav a{justify-content:center;padding:10px 0} select#scanSelect{max-width:150px}
    .grid2{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">WEB<span>RECON</span></div>
    <select id="scanSelect" title="Select a scan"></select>
    <div id="progress" class="prog"></div>
    <button id="cancelBtn" class="danger" style="display:none">Cancel</button>
    <div class="spacer"></div>
    <button class="icon" id="paletteBtn" title="Command palette">⌘K</button>
    <button class="icon" id="themeBtn" title="Toggle theme">◐</button>
    <button class="primary" id="newScanBtn">+ New Scan</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<!-- detail drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="dhead"><span class="t" id="drawerTitle"></span><div class="spacer" style="flex:1"></div>
    <button class="icon" id="drawerClose" title="Close (Esc)">✕</button></div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<!-- new scan dialog -->
<dialog id="scanDialog">
  <h1 style="margin:0 0 2px">New Scan</h1>
  <div class="sub">Only scan assets you own or are authorized to test.</div>
  <label>Target URL</label>
  <input type="text" id="f_url" placeholder="https://example.com">
  <div style="display:flex;gap:12px">
    <div style="flex:1"><label>Max depth</label><input type="number" id="f_depth" value="3"></div>
    <div style="flex:1"><label>Max pages</label><input type="number" id="f_pages" value="300"></div>
  </div>
  <label>Scope mode</label>
  <select id="f_scope"><option value="same-domain">same-domain</option>
    <option value="same-origin">same-origin</option>
    <option value="include-subdomains">include-subdomains</option></select>
  <label class="check"><input type="checkbox" id="f_browser"> Browser mode (render JS, screenshot)</label>
  <label class="check"><input type="checkbox" id="f_active"> Active API testing (authorized only)</label>
  <label class="check"><input type="checkbox" id="f_private"> Lab mode (allow private/loopback)</label>
  <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
    <button class="ghost" id="cancelDialog">Cancel</button>
    <button class="primary" id="startScanBtn">Start Scan</button>
  </div>
</dialog>

<!-- command palette -->
<div id="palette"><div class="palbox">
  <input id="palInput" placeholder="Jump to a section or run an action…" autocomplete="off">
  <div class="palresults" id="palResults"></div>
</div></div>

<div id="toasts"></div>

<script type="module">
/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const el = (t,a={},...k)=>{const n=document.createElement(t);
  for(const[x,v]of Object.entries(a)){if(x==="class")n.className=v;else if(x==="html")n.innerHTML=v;
    else if(x.startsWith("on"))n.addEventListener(x.slice(2),v);else n.setAttribute(x,v);}
  for(const c of k)n.append(c==null?"":c.nodeType?c:document.createTextNode(String(c)));return n;};
async function api(p){
  const r=await fetch(p);
  if(!r.ok) throw new Error(`${r.status} ${p.split("/").pop()}`);
  return r.json();
}
function toast(msg,type=""){const t=el("div",{class:"toast "+type},msg);$("#toasts").append(t);
  setTimeout(()=>{t.style.opacity="0";setTimeout(()=>t.remove(),300);},3200);}
function copyBtn(text){return el("span",{class:"copy",title:"Copy",
  onclick:e=>{e.stopPropagation();navigator.clipboard?.writeText(text);toast("Copied","ok");}},"copy");}
const riskColor=s=>({critical:"var(--crit)",high:"var(--high)",medium:"var(--med)",
  low:"var(--low)",informational:"var(--info)"})[s]||"var(--info)";
const sevPill=s=>el("span",{class:`pill ${s}`},s);
const obs=o=>el("span",{class:"obs-"+o},o);

/* ============================ state ============================ */
const SECTIONS=[
  ["Recon",["Overview"]],
  ["Content",["Findings","Endpoints","Technologies","Pages","Assets","Forms"]],
  ["Infra",["DNS / TLS","Graph"]],
  ["Output",["Timeline","Reports"]],
];
const FLATSECTIONS=SECTIONS.flatMap(([,items])=>items);
const state={scanId:null,section:"Overview",ws:null,runningId:null,sevFilter:new Set(),counts:{}};

/* ============================ theme ============================ */
const root=document.documentElement;
root.dataset.theme=localStorage.getItem("wr-theme")||"dark";
$("#themeBtn").onclick=()=>{const t=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=t;localStorage.setItem("wr-theme",t);};

/* ============================ nav ============================ */
const ICONS={
  "Overview":'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
  "Findings":'<path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M12 8v4"/>',
  "Endpoints":'<path d="M9 2v4M15 2v4M7 6h10v4a5 5 0 0 1-10 0z"/><path d="M12 15v6"/>',
  "Technologies":'<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  "Pages":'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  "Assets":'<path d="M12 3l8 4v10l-8 4-8-4V7z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
  "Forms":'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h4"/>',
  "DNS / TLS":'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  "Graph":'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 11l8-4M8 13l8 4"/>',
  "Timeline":'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4M12 8v4l3 2"/>',
  "Reports":'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
};
function iconEl(name){
  const inner=ICONS[name]||'<circle cx="12" cy="12" r="3"/>';
  return el("span",{class:"navic",html:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`});
}
function renderNav(){
  const nav=$("#nav");nav.innerHTML="";
  for(const[grp,items] of SECTIONS){
    nav.append(el("div",{class:"grp"},el("span",{},grp)));
    for(const s of items){
      const a=el("a",{class:s===state.section?"active":"",onclick:()=>go(s)},
        iconEl(s),el("span",{},s));
      const c=state.counts[s]; if(c!=null) a.append(el("span",{class:"badge"},String(c)));
      nav.append(a);
    }
  }
}
function go(section){state.section=section;renderNav();render();}

/* ============================ drawer ============================ */
function openDrawer(title,sections){
  $("#drawerTitle").textContent=title;
  const body=$("#drawerBody");body.innerHTML="";
  for(const sec of sections){
    if(!sec) continue;
    const box=el("div",{class:"dsec"},el("h3",{},sec.label));
    if(sec.rows){for(const[k,v]of sec.rows){ if(v==null||v==="") continue;
      box.append(el("div",{class:"drow"},el("span",{class:"dk"},k),el("span",{class:"dv"},v)));}}
    if(sec.tags){box.append(el("div",{class:"taglist"},...sec.tags.map(t=>el("span",{class:"tag"},t))));}
    if(sec.evidence){for(const e of sec.evidence)
      box.append(el("div",{class:"evi"},typeof e==="string"?e:JSON.stringify(e,null,2)));}
    if(sec.raw!==undefined){
      const pre=el("div",{class:"evi",style:"display:none"},JSON.stringify(sec.raw,null,2));
      box.append(el("button",{class:"ghost",style:"font-size:12px;padding:4px 10px",
        onclick:()=>{pre.style.display=pre.style.display==="none"?"":"none";}},"Toggle raw JSON"),pre);
    }
    body.append(box);
  }
  $("#scrim").classList.add("on");$("#drawer").classList.add("on");
}
function closeDrawer(){$("#scrim").classList.remove("on");$("#drawer").classList.remove("on");}
$("#drawerClose").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();closePalette();}});

/* ============================ generic table ============================ */
function skeleton(n=8){const w=el("div");for(let i=0;i<n;i++)
  w.append(el("div",{class:"sk",style:`width:${60+Math.floor(i%3*15)}%`}));return w;}
function emptyState(msg="Nothing here."){return el("div",{class:"empty"},
  el("div",{class:"big"},"∅"),el("div",{},msg));}
function tbl(cols,rows){const t=el("table");const h=el("tr");cols.forEach(c=>h.append(el("th",{},c)));
  t.append(el("thead",{},h));const b=el("tbody");
  rows.forEach(r=>{const tr=el("tr");r.cells.forEach(c=>tr.append(el("td",{},c)));
    if(r.onclick){tr.className="clickable";tr.onclick=r.onclick;}b.append(tr);});
  t.append(b);return t;}
/** searchable table with optional row click -> drawer */
function dataTable(main,data,cols,mapRow){
  if(!data.length){main.append(emptyState());return;}
  const inp=el("input",{placeholder:`Search ${data.length} rows…`,oninput:apply});
  main.append(el("div",{class:"toolbar"},inp));
  const wrap=el("div");main.append(wrap);
  function apply(){const q=inp.value.toLowerCase();
    const rows=data.filter(d=>!q||JSON.stringify(d).toLowerCase().includes(q)).map(mapRow);
    wrap.innerHTML="";wrap.append(rows.length?tbl(cols,rows):emptyState("No matches."));}
  apply();
}

/* ============================ sections ============================ */
async function render(){
  const m=$("#main");m.innerHTML="";const shell=el("div",{class:"fade"});m.append(shell);
  if(!state.scanId){shell.append(emptyState("No scan selected — start one with “New Scan”."));return;}
  shell.append(skeleton());
  try{ const build=RENDER[state.section]; const node=await build(); shell.innerHTML="";shell.append(node); }
  catch(e){ shell.innerHTML="";shell.append(emptyState("Error: "+e.message)); toast("Load failed: "+e.message,"err"); }
}
const SID=()=>state.scanId;
const RENDER={
  async Overview(){
    const o=await api(`/api/scans/${SID()}`);
    const w=el("div");
    w.append(el("h1",{},o.target.base_url||"—"),
      el("div",{class:"sub"},`${o.status} · ${o.target.hostname||""} · scan ${o.id.slice(0,8)}`));
    const risk=o.risk_level||"informational";
    w.append(el("div",{class:"riskhero"},
      el("div",{class:"riskbadge",style:`background:${riskColor(risk)}`},risk),
      severityDonut(o.findings_by_severity||{}),
      el("div",{},el("div",{class:"k",style:"color:var(--muted);font-size:11px"},"TOTAL FINDINGS"),
        el("div",{style:"font-size:26px;font-weight:800"},String(o.total_findings)))));
    const cards=el("div",{class:"cards"});
    for(const s of ["critical","high","medium","low","informational"])
      cards.append(el("div",{class:"card"},el("div",{class:"k"},s),
        el("div",{class:"v",style:`color:${(o.findings_by_severity?.[s])?riskColor(s):"var(--faint)"}`},
          String(o.findings_by_severity?.[s]||0))));
    w.append(cards);
    // screenshot (click opens full image in a new tab)
    const img=new Image();img.className="shot";img.src=`/api/scans/${SID()}/screenshot`;
    img.title="Open full screenshot";
    img.onclick=()=>window.open(img.src,"_blank");
    img.onload=()=>{w.append(el("h2",{},"Screenshot"));w.append(img);};
    w.append(el("h2",{},"Technology"));
    if(o.technologies.length)w.append(tbl(["name","category","version","confidence"],
      o.technologies.map(t=>({cells:[t.name,t.category,t.version||"—",
        el("span",{class:"pill "+confClass(t.confidence)},t.confidence)]}))));
    else w.append(el("div",{class:"sub"},"none detected"));
    w.append(el("h2",{},"Module timing"));
    w.append(moduleTiming(o.modules));
    return w;
  },
  async Findings(){
    const data=await api(`/api/scans/${SID()}/findings`);
    const w=el("div");w.append(el("h1",{},"Findings"),el("div",{class:"sub"},`${data.length} total`));
    if(!data.length){w.append(emptyState("No findings — clean scan.")); return w;}
    const counts={};for(const f of data)counts[f.severity]=(counts[f.severity]||0)+1;
    const bar=el("div",{class:"toolbar"});
    const search=el("input",{placeholder:"Search findings…",oninput:apply});bar.append(search);
    for(const s of ["critical","high","medium","low","informational"]){ if(!counts[s])continue;
      const chip=el("span",{class:`chip ${s}`+(state.sevFilter.has(s)?" on":""),
        onclick:()=>{state.sevFilter.has(s)?state.sevFilter.delete(s):state.sevFilter.add(s);
          chip.classList.toggle("on");apply();}},`${s} ${counts[s]}`);bar.append(chip);}
    w.append(bar);const list=el("div");w.append(list);
    function apply(){list.innerHTML="";const q=search.value.toLowerCase();
      const items=data.filter(f=>(!state.sevFilter.size||state.sevFilter.has(f.severity))
        &&(!q||JSON.stringify(f).toLowerCase().includes(q)));
      if(!items.length){list.append(emptyState("No matching findings."));return;}
      for(const f of items){
        const card=el("div",{class:"finding"});
        const head=el("div",{class:"head",onclick:()=>card.classList.toggle("open")},
          sevPill(f.severity),el("span",{class:"name"},f.name),
          el("span",{class:"kv"},`· ${f.confidence} · `),obs(f.observation),
          el("span",{class:"kv",style:"margin-left:auto"},f.check_id));
        const body=el("div",{class:"body"});
        body.append(el("p",{},f.description));
        if(f.impact)body.append(el("div",{},el("b",{},"Impact: "),f.impact));
        if(f.recommendation)body.append(el("div",{},el("b",{},"Fix: "),f.recommendation));
        for(const e of f.evidence)body.append(el("div",{class:"evi"},
          `[${e.source}] ${e.url||""}\n${JSON.stringify(e.data)}`));
        if(f.references?.length)body.append(el("div",{class:"kv",style:"margin-top:6px"},
          ...f.references.map(r=>el("a",{href:r,target:"_blank"},r+" "))));
        card.append(head,body);list.append(card);
      }
    }
    apply();return w;
  },
  async Endpoints(){
    const d=await api(`/api/scans/${SID()}/endpoints`);
    const w=el("div");w.append(el("h1",{},"API Endpoints"),
      el("div",{class:"sub"},`${d.length} total · click a row for detail`));
    dataTable(w,d,["observation","kind","method","url","source"],e=>({
      cells:[obs(e.observation),e.kind,e.method||"—",el("code",{},e.url),el("span",{class:"kv"},e.source||"")],
      onclick:()=>openDrawer("Endpoint",[
        {label:"Overview",rows:[["URL",el("span",{},el("code",{},e.url),copyBtn(e.url))],
          ["Kind",e.kind],["Method",e.method||"—"],["Observation",obs(e.observation)],
          ["In scope",String(e.meta?.in_scope??"—")]]},
        {label:"Sources",tags:(e.meta?.sources||(e.source?e.source.split(","):[]))},
        {label:"Raw",raw:e}])}));
    return w;
  },
  async Technologies(){
    const d=await api(`/api/scans/${SID()}/technologies`);
    const w=el("div");w.append(el("h1",{},"Technologies"),
      el("div",{class:"sub"},`${d.length} detected · click for evidence`));
    dataTable(w,d,["name","category","version","confidence"],t=>({
      cells:[t.name,t.category,t.version||"—",el("span",{class:"pill "+confClass(t.confidence)},t.confidence)],
      onclick:()=>openDrawer(t.name,[
        {label:"Overview",rows:[["Name",t.name],["Category",t.category],["Version",t.version||"—"],
          ["Confidence",el("span",{class:"pill "+confClass(t.confidence)},t.confidence)]]},
        {label:"Evidence signals",evidence:(t.evidence||[]).map(x=>
          `[${x.source}] ${x.detail}${x.version?"  (v"+x.version+")":""}`)},
        {label:"Raw",raw:t}])}));
    return w;
  },
  async Pages(){
    const d=await api(`/api/scans/${SID()}/pages`);
    const w=el("div");w.append(el("h1",{},"Pages"),el("div",{class:"sub"},`${d.length} crawled`));
    dataTable(w,d,["status","depth","title","url"],p=>({
      cells:[p.status_code||"—",p.depth,p.title||"—",el("code",{},p.url)],
      onclick:()=>openDrawer("Page",[
        {label:"Overview",rows:[["URL",el("span",{},el("code",{},p.url),copyBtn(p.url))],
          ["Title",p.title||"—"],["Status",String(p.status_code||"—")],["Depth",String(p.depth)]]},
        {label:"Provenance",rows:[["Discovered from",p.discovered_from?el("code",{},p.discovered_from):"seed"]]},
        {label:"Integrity",rows:[["SHA-256",p.content_hash?el("code",{},p.content_hash):"—"]]},
        {label:"Raw",raw:p}])}));
    return w;
  },
  async Assets(){
    const d=await api(`/api/scans/${SID()}/assets`);
    const w=el("div");w.append(el("h1",{},"Assets"),el("div",{class:"sub"},`${d.length} discovered`));
    dataTable(w,d,["type","observation","url"],a=>({
      cells:[a.asset_type,obs(a.observation),el("code",{},a.url)],
      onclick:()=>openDrawer("Asset",[
        {label:"Overview",rows:[["URL",el("span",{},el("code",{},a.url),copyBtn(a.url))],
          ["Type",a.asset_type],["Observation",obs(a.observation)],
          ["Size",a.size_bytes?a.size_bytes+" B":"—"],
          ["SHA-256",a.content_hash?el("code",{},a.content_hash):"—"]]},
        {label:"Meta",raw:a.meta||{}},{label:"Raw",raw:a}])}));
    return w;
  },
  async Forms(){
    const d=await api(`/api/scans/${SID()}/forms`);
    const w=el("div");w.append(el("h1",{},"Forms"),el("div",{class:"sub"},`${d.length} found`));
    if(!d.length){w.append(emptyState("No forms.")); return w;}
    for(const f of d){
      const sens=(f.inputs||[]).some(i=>/pass|otp|card|credit/i.test((i.name||"")+(i.type||"")));
      w.append(el("div",{class:"finding open"},
        el("div",{class:"head"},el("span",{class:"pill "+(sens?"high":"informational")},
          (f.method||"get").toUpperCase()),el("code",{},f.action||f.page_url),
          sens?el("span",{class:"kv"},"· sensitive"):""),
        el("div",{class:"body"},el("div",{class:"kv"},`on ${f.page_url} · enctype ${f.enctype||"—"}`),
          tbl(["name","type","required"],(f.inputs||[]).map(i=>({
            cells:[i.name||"—",i.type||"—",i.required?"yes":""]}))))));
    }
    return w;
  },
  async "DNS / TLS"(){
    const [dns,certs]=await Promise.all([api(`/api/scans/${SID()}/dns`),api(`/api/scans/${SID()}/certificates`)]);
    const w=el("div");w.append(el("h1",{},"DNS / TLS"));
    w.append(el("h2",{},"DNS records"));
    if(dns.length)w.append(tbl(["type","name","value"],
      dns.map(d=>({cells:[d.record_type,d.name,el("code",{},d.value)]}))));
    else w.append(el("div",{class:"sub"},"none (or IP-literal target)"));
    w.append(el("h2",{},"Certificates"));
    if(certs.length)w.append(tbl(["subject","issuer","valid until"],certs.map(c=>({
      cells:[c.subject,c.issuer,c.not_after||"—"],
      onclick:()=>openDrawer("Certificate",[
        {label:"Subject / Issuer",rows:[["Subject",c.subject],["Issuer",c.issuer]]},
        {label:"Validity",rows:[["Not before",c.not_before||"—"],["Not after",c.not_after||"—"]]},
        {label:"SAN",tags:c.san||[]},
        {label:"Details",raw:c.details||{}},{label:"Raw",raw:c}])}))));
    else w.append(el("div",{class:"sub"},"none"));
    return w;
  },
  async Graph(){ return await graphView(); },
  async Timeline(){ return await timelineView(); },
  async Reports(){ return reportsView(); },
};
function confClass(c){return (c==="confirmed"||c==="high")?"low":"informational";}

/* ---- small SVG charts ---- */
function severityDonut(counts){
  const order=["critical","high","medium","low","informational"];
  const total=order.reduce((s,k)=>s+(counts[k]||0),0);
  const NS="http://www.w3.org/2000/svg",R=34,C=2*Math.PI*R;
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("width",92);svg.setAttribute("height",92);
  svg.setAttribute("viewBox","0 0 92 92");
  const track=document.createElementNS(NS,"circle");
  for(const[a,v]of Object.entries({cx:46,cy:46,r:R,fill:"none",stroke:"var(--panel3)","stroke-width":11}))
    track.setAttribute(a,v);svg.append(track);
  let off=0;
  if(total){for(const k of order){const v=counts[k]||0;if(!v)continue;const frac=v/total;
    const c=document.createElementNS(NS,"circle");
    for(const[a,val]of Object.entries({cx:46,cy:46,r:R,fill:"none",stroke:riskColor(k),
      "stroke-width":11,"stroke-dasharray":`${frac*C} ${C}`,"stroke-dashoffset":-off*C,
      transform:"rotate(-90 46 46)"}))c.setAttribute(a,val);svg.append(c);off+=frac;}}
  const t=document.createElementNS(NS,"text");t.setAttribute("x",46);t.setAttribute("y",50);
  t.setAttribute("text-anchor","middle");t.setAttribute("font-size","20");t.setAttribute("font-weight","800");
  t.textContent=String(total);svg.append(t);
  return svg;
}
function moduleTiming(modules){
  const max=Math.max(1,...modules.map(m=>m.duration_ms||0));
  const w=el("div",{class:"modgrid"});
  for(const m of modules){const dc=m.status==="success"?"ok":(m.status==="failed"||m.status==="timeout")?"fail":"";
    const pct=Math.round((m.duration_ms||0)/max*100);
    w.append(el("div",{class:"modcell"},el("span",{class:"dot "+dc}),
      el("span",{style:"flex:1"},m.module),
      el("span",{class:"bar",style:"width:60px"},el("i",{style:`width:${pct}%`})),
      el("span",{class:"kv"},m.duration_ms?Math.round(m.duration_ms)+"ms":m.status)));}
  return w;
}
async function graphView(){
  const g=await api(`/api/scans/${SID()}/graph`);const w=el("div");
  w.append(el("h1",{},"Relationship Graph"));
  const color={domain:"#4da3ff",technology:"#7c5cff",endpoint:"#3ddc97",dns:"#f2c14e",certificate:"#ff784e"};
  const legend=el("div",{class:"legend"});
  for(const[k,v]of Object.entries(color))legend.append(el("span",{},el("b",{style:`background:${v}`}),k));
  w.append(legend);
  if(!g.nodes.length){w.append(emptyState("No graph data."));return w;}
  const W=Math.min($("#main").clientWidth-10,980),H=560,cx=W/2,cy=H/2,NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("width",W);svg.setAttribute("height",H);
  const others=g.nodes.slice(1),pos={[g.nodes[0].id]:[cx,cy]};
  others.forEach((n,i)=>{const a=2*Math.PI*i/others.length,r=Math.min(W,H)/2-70;
    pos[n.id]=[cx+r*Math.cos(a),cy+r*Math.sin(a)];});
  for(const e of g.edges){const[x1,y1]=pos[e.source]||[cx,cy],[x2,y2]=pos[e.target]||[cx,cy];
    const l=document.createElementNS(NS,"line");for(const[a,v]of Object.entries({x1,y1,x2,y2,stroke:"var(--border)"}))
      l.setAttribute(a,v);svg.append(l);}
  for(const n of g.nodes){const[x,y]=pos[n.id];const c=document.createElementNS(NS,"circle");
    for(const[a,v]of Object.entries({cx:x,cy:y,r:n.type==="domain"?10:5.5,fill:color[n.type]||"#8a93a6"}))
      c.setAttribute(a,v);const tt=document.createElementNS(NS,"title");tt.textContent=n.label;c.append(tt);svg.append(c);
    const t=document.createElementNS(NS,"text");t.setAttribute("x",x+9);t.setAttribute("y",y+3);
    t.setAttribute("font-size","10");t.textContent=(n.label||"").slice(0,42);svg.append(t);}
  w.append(svg);return w;
}
async function timelineView(){
  const w=el("div");w.append(el("h1",{},"Timeline / Compare"));
  const scans=(await api("/api/scans")).filter(s=>s.id!==SID());
  if(!scans.length){w.append(emptyState("Need at least two scans to compare."));return w;}
  const sel=el("select",{},el("option",{value:""},"— pick a scan to compare against —"),
    ...scans.map(s=>el("option",{value:s.id},`${s.target} · ${s.created_at.slice(0,16).replace("T"," ")}`)));
  w.append(el("div",{class:"toolbar"},el("span",{class:"sub"},"Compare current scan against:"),sel));
  const out=el("div");w.append(out);
  sel.onchange=async()=>{ if(!sel.value){out.innerHTML="";return;}
    out.innerHTML="";out.append(skeleton(4));
    const d=await api(`/api/scans/${SID()}/diff?against=${sel.value}`);out.innerHTML="";
    const grid=el("div",{class:"grid2"});
    for(const key of ["endpoints","technologies","findings"]){
      const col=el("div",{class:"diffcol"});col.append(el("h2",{},key));
      const {added,removed}=d[key];
      if(!added.length&&!removed.length)col.append(el("div",{class:"sub"},"no change"));
      added.forEach(x=>col.append(el("div",{class:"add"},"+ "+x)));
      removed.forEach(x=>col.append(el("div",{class:"rem"},"− "+x)));grid.append(col);}
    out.append(grid);};
  return w;
}
function reportsView(){
  const w=el("div");w.append(el("h1",{},"Reports"),el("div",{class:"sub"},"Generated from stored scan data"));
  const base=`/api/scans/${SID()}/report`;
  w.append(el("div",{class:"btnrow"},
    el("a",{href:`${base}.json`,target:"_blank"},el("button",{class:"ghost"},"Open JSON")),
    el("a",{href:`${base}.html`,target:"_blank"},el("button",{class:"ghost"},"Open HTML")),
    el("a",{href:`${base}.pdf`,target:"_blank"},el("button",{class:"primary"},"Open / Download PDF"))));
  w.append(el("h2",{},"HTML preview"),el("iframe",{class:"preview",src:`${base}.html`}));
  return w;
}

/* ============================ scans + progress ============================ */
async function loadScans(keep){
  const scans=await api("/api/scans");const sel=$("#scanSelect");sel.innerHTML="";
  if(!scans.length){sel.append(el("option",{},"— no scans —"));return scans;}
  for(const s of scans)sel.append(el("option",{value:s.id},
    `${s.target}  ·  ${s.status}  ·  ${s.findings} findings  ·  ${s.created_at.slice(0,16).replace("T"," ")}`));
  sel.onchange=()=>{state.scanId=sel.value;refreshCounts().then(render);};
  if(!keep||!scans.find(s=>s.id===state.scanId))state.scanId=scans[0].id;
  sel.value=state.scanId;return scans;
}
async function refreshCounts(){
  state.counts={};
  try{const o=await api(`/api/scans/${SID()}`);state.counts.Findings=o.total_findings;
    state.counts.Technologies=o.technologies.length;}catch{}
  try{state.counts.Endpoints=(await api(`/api/scans/${SID()}/endpoints`)).length;}catch{}
  renderNav();
}
$("#newScanBtn").onclick=()=>$("#scanDialog").showModal();
$("#cancelDialog").onclick=()=>$("#scanDialog").close();
$("#startScanBtn").onclick=async()=>{
  const body={url:$("#f_url").value.trim(),depth:+$("#f_depth").value,max_pages:+$("#f_pages").value,
    browser:$("#f_browser").checked,allow_private:$("#f_private").checked,
    active:$("#f_active").checked,scope_mode:$("#f_scope").value};
  if(!body.url){$("#f_url").focus();return;}
  $("#scanDialog").close();
  try{const {scan_id}=await fetch("/api/scans",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify(body)}).then(r=>r.json());toast("Scan started","ok");watch(scan_id);}
  catch(e){toast("Could not start scan","err");}
};
$("#cancelBtn").onclick=()=>{ if(state.runningId){fetch(`/api/scans/${state.runningId}/cancel`,{method:"POST"});
  toast("Cancelling…");}};
function watch(scanId){
  state.runningId=scanId;$("#cancelBtn").style.display="";
  const prog=$("#progress"),bar=el("i"),wrap=el("span",{class:"bar"},bar),label=el("span",{},"starting…");
  prog.innerHTML="";prog.append(el("span",{class:"dot run"}),wrap,label);
  if(state.ws)state.ws.close();
  const ws=new WebSocket(`ws://${location.host}/api/scans/${scanId}/events`);state.ws=ws;
  ws.onmessage=m=>{const ev=JSON.parse(m.data);
    if(ev.module==="_done"){bar.style.width="100%";label.textContent=ev.status;
      prog.querySelector(".dot").className="dot "+(ev.status==="done"?"ok":"fail");
      $("#cancelBtn").style.display="none";toast("Scan "+ev.status,ev.status==="done"?"ok":"err");
      loadScans().then(()=>{state.scanId=scanId;$("#scanSelect").value=scanId;refreshCounts().then(render);});
      setTimeout(()=>{prog.innerHTML="";},4000);return;}
    const pct=ev.total?Math.round((ev.index+1)/ev.total*100):0;
    bar.style.width=pct+"%";label.textContent=`${ev.module} (${ev.index+1}/${ev.total})`;};
  ws.onerror=()=>{prog.querySelector(".dot")?.classList.add("fail");};
}

/* ============================ command palette ============================ */
const PAL=$("#palette"),PALIN=$("#palInput"),PALRES=$("#palResults");let palSel=0,palItems=[];
function openPalette(){buildPalette("");PAL.classList.add("on");PALIN.value="";PALIN.focus();}
function closePalette(){PAL.classList.remove("on");}
$("#paletteBtn").onclick=openPalette;
addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();}});
function buildPalette(q){
  const actions=[
    ...FLATSECTIONS.map(s=>({label:"Go to "+s,hint:"section",run:()=>go(s)})),
    {label:"New Scan",hint:"action",run:()=>$("#scanDialog").showModal()},
    {label:"Toggle theme",hint:"action",run:()=>$("#themeBtn").click()},
    {label:"Open Reports",hint:"action",run:()=>go("Reports")},
  ];
  palItems=actions.filter(a=>a.label.toLowerCase().includes(q.toLowerCase()));palSel=0;drawPalette();
}
function drawPalette(){PALRES.innerHTML="";palItems.forEach((a,i)=>{
  PALRES.append(el("div",{class:"palitem"+(i===palSel?" sel":""),
    onclick:()=>{closePalette();a.run();}},a.label,el("span",{class:"hint"},a.hint)));});}
PALIN.oninput=()=>buildPalette(PALIN.value);
PALIN.onkeydown=e=>{
  if(e.key==="ArrowDown"){palSel=Math.min(palSel+1,palItems.length-1);drawPalette();e.preventDefault();}
  else if(e.key==="ArrowUp"){palSel=Math.max(palSel-1,0);drawPalette();e.preventDefault();}
  else if(e.key==="Enter"){const a=palItems[palSel];if(a){closePalette();a.run();}}
};
PAL.onclick=e=>{if(e.target===PAL)closePalette();};

/* ============================ boot ============================ */
renderNav();
loadScans().then(()=>refreshCounts()).then(render);
</script>
