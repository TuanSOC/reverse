<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebRecon</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Ctext x='16' y='22' font-size='18' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%234da3ff'%3EW%3C/text%3E%3C/svg%3E">
<style>
  /* ---- design tokens (dark default, light override) ---- */
  :root{
    --bg:#07090e; --panel:#0d121c; --panel2:#131826; --panel3:#1a2133; --border:#1e2638;
    --fg:#e2e8f0; --muted:#8e9cb2; --faint:#5c6880; --accent:#3b82f6; --accent2:#6366f1;
    --crit:#f43f5e; --high:#f97316; --med:#eab308; --low:#06b6d4; --info:#64748b; --ok:#10b981;
    --shadow:0 14px 45px rgba(0,0,0,.6); --radius:14px;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f8fafc; --panel:#ffffff; --panel2:#f1f5f9; --panel3:#e2e8f0; --border:#cbd5e1;
    --fg:#0f172a; --muted:#475569; --faint:#64748b; --accent:#2563eb; --accent2:#4f46e5;
    --crit:#e11d48; --high:#ea580c; --med:#ca8a04; --low:#0891b2; --info:#64748b; --ok:#059669;
    --shadow:0 14px 40px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 var(--font)}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  button,select,input{font:inherit;color:var(--fg);background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;padding:7px 11px;transition:.12s}
  button{cursor:pointer} button:hover{border-color:var(--accent)}
  button.primary{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#fff;
    border:0;font-weight:700} button.primary:hover{filter:brightness(1.08)}
  button.ghost{background:transparent} button.icon{padding:7px 9px;background:transparent}
  button.danger{background:transparent;border-color:#5a2530;color:var(--crit)}
  .app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:56px 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;
    background:var(--panel);border-bottom:1px solid var(--border);z-index:20}
  .brand{font-weight:800;letter-spacing:1px;font-size:15px;user-select:none}
  .brand span{color:var(--accent)} .spacer{flex:1}
  select#scanSelect{max-width:400px}

  /* HTTP Method Badges */
  .m-badge{font:700 11px var(--mono);padding:2px 7px;border-radius:5px;display:inline-block;letter-spacing:.02em;text-align:center;min-width:44px}
  .m-get{background:#0e7490;color:#e0f2fe;box-shadow:0 0 10px -3px #0e7490}
  .m-post{background:#b45309;color:#fef3c7;box-shadow:0 0 10px -3px #b45309}
  .m-put{background:#6d28d9;color:#ede9fe;box-shadow:0 0 10px -3px #6d28d9}
  .m-delete{background:#be123c;color:#ffe4e6;box-shadow:0 0 10px -3px #be123c}
  .m-patch{background:#047857;color:#d1fae5;box-shadow:0 0 10px -3px #047857}
  .m-other{background:var(--panel3);color:var(--fg)}

  /* Role Badges */
  .role-badge{font:600 11.5px var(--mono);padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
  .role-login{background:color-mix(in srgb,#3b82f6 20%,transparent);color:#60a5fa;border:1px solid color-mix(in srgb,#3b82f6 40%,transparent)}
  .role-logout{background:color-mix(in srgb,#f43f5e 20%,transparent);color:#fb7185;border:1px solid color-mix(in srgb,#f43f5e 40%,transparent)}
  .role-identity{background:color-mix(in srgb,#8b5cf6 20%,transparent);color:#a78bfa;border:1px solid color-mix(in srgb,#8b5cf6 40%,transparent)}
  .role-reset{background:color-mix(in srgb,#f59e0b 20%,transparent);color:#fbbf24;border:1px solid color-mix(in srgb,#f59e0b 40%,transparent)}
  .role-authorize{background:color-mix(in srgb,#06b6d4 20%,transparent);color:#22d3ee;border:1px solid color-mix(in srgb,#06b6d4 40%,transparent)}
  .role-token{background:color-mix(in srgb,#10b981 20%,transparent);color:#34d399;border:1px solid color-mix(in srgb,#10b981 40%,transparent)}
  .role-callback{background:color-mix(in srgb,#ec4899 20%,transparent);color:#f472b6;border:1px solid color-mix(in srgb,#ec4899 40%,transparent)}
  .role-register{background:color-mix(in srgb,#84cc16 20%,transparent);color:#a3e635;border:1px solid color-mix(in srgb,#84cc16 40%,transparent)}
  .role-unknown{background:var(--panel3);color:var(--muted);border:1px solid var(--border)}

  /* Interactive Auth Flow Pipeline */
  .auth-pipeline{display:flex;gap:12px;align-items:stretch;margin:16px 0;overflow-x:auto;padding-bottom:12px;-webkit-overflow-scrolling:touch}
  .flow-step-card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--border));border-radius:14px;padding:14px 18px;min-width:220px;flex:1;position:relative;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px -10px rgba(0,0,0,.5);transition:all .2s cubic-bezier(.2,.8,.2,1)}
  .flow-step-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 30px -8px color-mix(in srgb,var(--accent) 30%,transparent)}
  .flow-step-card .step-head{display:flex;align-items:center;gap:8px}
  .flow-step-card .step-num{width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
  .flow-step-card .step-role{font-weight:700;font-size:13.5px;color:var(--fg)}
  .flow-step-card .step-url{font:11px var(--mono);color:var(--accent);word-break:break-all}
  .flow-step-card .step-desc{font-size:12px;color:var(--muted);line-height:1.4}
  .flow-step-card .step-foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px}
  .flow-step-card .step-foot .step-url{margin:0}
  .statdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .statdot.ok{background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent);animation:statpulse 1.8s infinite}
  .statdot.ref{background:var(--accent)} .statdot.pot{background:var(--faint)}
  @keyframes statpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .flow-arrow{display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px;opacity:.7;padding:0 4px;flex:0 0 auto}

  /* Quick Switcher Trigger & Modal */
  .scan-switcher{display:inline-flex;align-items:center}
  .switcher-trigger{display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid color-mix(in srgb,var(--accent) 25%,var(--border));border-radius:10px;color:var(--fg);cursor:pointer;font-size:13px;max-width:400px;min-width:240px;transition:.15s;text-align:left}
  .switcher-trigger:hover{border-color:var(--accent);box-shadow:0 0 16px -4px color-mix(in srgb,var(--accent) 30%,transparent)}
  .switcher-trigger .s-target{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .switcher-trigger .s-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel3);color:var(--muted)}
  .switcher-modal{width:min(580px,94vw);padding:0;background:var(--panel);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.7);backdrop-filter:blur(20px);color:var(--fg)}
  .switcher-modal::backdrop{backdrop-filter:blur(6px);background:rgba(0,0,0,.5)}
  .switcher-search-box{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .switcher-search-box input{flex:1;background:transparent;border:none;font-size:15px;color:var(--fg);outline:none;padding:4px}
  .switcher-list{max-height:380px;overflow-y:auto;padding:8px}
  .switcher-opt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:.1s;border:1px solid transparent;
    width:100%;text-align:left;background:transparent;color:inherit;font:inherit}
  .switcher-opt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .switcher-row{display:flex;align-items:center;gap:4px}
  .switcher-row .switcher-opt{flex:1;min-width:0}
  .switcher-del{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:9px;
    color:var(--faint);padding:8px 10px;cursor:pointer;font-size:14px;transition:.12s}
  .switcher-del:hover{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 10%,transparent)}
  .switcher-del.confirm{color:#fff;background:var(--crit);border-color:transparent;font-weight:700;font-size:11.5px}
  .switcher-opt:hover,.switcher-opt.selected{background:color-mix(in srgb,var(--accent) 12%,var(--panel2));border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .switcher-opt .s-info{flex:1;min-width:0}
  .switcher-opt .s-title{font-weight:700;font-size:13.5px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .switcher-opt .s-meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:3px}

  .kbd{font:11px var(--mono);background:var(--panel2);border:1px solid var(--border);
    border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--muted)}
  nav{background:var(--panel);border-right:1px solid var(--border);padding:12px 10px;overflow:auto}
  nav .grp{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;
    margin:15px 10px 6px}
  nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;
    color:var(--muted);cursor:pointer;font-size:13.5px;position:relative}
  nav a .ic{width:7px;height:7px;border-radius:2px;background:var(--faint);transition:.15s}
  nav a.active{background:var(--panel3);color:var(--fg)} nav a.active .ic{background:var(--accent)}
  nav a:hover{background:var(--panel2);color:var(--fg)} nav a .badge{margin-left:auto;
    font:11px var(--mono);color:var(--faint)}
  main{overflow:auto;padding:22px 26px;position:relative}
  h1{font-size:21px;margin:0 0 3px} .sub{color:var(--muted);font-size:13px}
  h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:26px 0 10px}
  .fade{animation:fade .25s ease} @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
  /* cards + hero */
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 18px;min-width:110px}
  .card .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  .card .v{font-size:24px;font-weight:800;margin-top:6px}
  .riskhero{display:flex;align-items:center;gap:18px;background:var(--panel);
    border:1px solid var(--border);border-radius:14px;padding:18px 22px;margin:16px 0}
  .riskbadge{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
    padding:9px 16px;border-radius:10px;color:#fff}
  /* tables */
  table{width:100%;border-collapse:collapse;margin-top:4px;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    position:sticky;top:0;background:var(--bg);z-index:1}
  tbody tr{cursor:pointer;transition:.1s} tbody tr:hover td{background:var(--panel)}
  tbody tr.clickable td:last-child::after{content:"›";color:var(--faint);float:right}
  code,.mono{font-family:var(--mono);font-size:12px;word-break:break-all}
  .pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .b-critical,.pill.critical{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
  .b-high,.pill.high{background:color-mix(in srgb,var(--high) 18%,transparent);color:var(--high)}
  .b-medium,.pill.medium{background:color-mix(in srgb,var(--med) 18%,transparent);color:var(--med)}
  .b-low,.pill.low{background:color-mix(in srgb,var(--low) 18%,transparent);color:var(--low)}
  .b-informational,.pill.informational{background:color-mix(in srgb,var(--info) 24%,transparent);color:var(--muted)}
  .obs-observed{color:var(--ok);font-weight:600}.obs-referenced{color:var(--accent)}.obs-potential{color:var(--muted)}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .toolbar input{min-width:240px}
  .chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border);cursor:pointer;
    font-size:12px;color:var(--muted);background:var(--panel2);user-select:none}
  .chip.on{color:#fff;border-color:transparent}
  .chip.critical.on{background:var(--crit)}.chip.high.on{background:var(--high)}
  .chip.medium.on{background:var(--med);color:#04101f}.chip.low.on{background:var(--low);color:#04101f}
  .chip.informational.on{background:var(--info)}
  /* findings */
  .finding{border:1px solid var(--border);border-radius:10px;margin:9px 0;overflow:hidden;background:var(--panel)}
  .finding>.head{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}
  .finding>.head:hover{background:var(--panel2)}
  .finding .body{padding:0 14px 14px;border-top:1px solid var(--border);display:none}
  .finding.open .body{display:block;animation:fade .2s}
  .finding .name{font-weight:600}.kv{color:var(--muted);font-size:12px}
  .evi{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;
    margin-top:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word}
  .empty{color:var(--muted);padding:40px 0;text-align:center}
  .empty .big{font-size:34px;opacity:.5} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  /* skeleton */
  .sk{background:linear-gradient(90deg,var(--panel2) 25%,var(--panel3) 37%,var(--panel2) 63%);
    background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:6px;height:14px;margin:8px 0}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
  /* progress */
  .prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
  .bar{width:170px;height:6px;background:var(--panel3);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .3s}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.ok{background:var(--ok)}.dot.run{background:var(--med);animation:pulse 1s infinite}.dot.fail{background:var(--crit)}
  @keyframes pulse{50%{opacity:.35}}
  .modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}
  .modcell{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);
    border-radius:8px;font-size:12px;background:var(--panel)}
  .shot{max-width:320px;border:1px solid var(--border);border-radius:10px;cursor:zoom-in;transition:.15s}
  .shot:hover{filter:brightness(1.05)}
  /* charts */
  .charts{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin:8px 0}
  svg text{fill:var(--fg)}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,94vw);background:var(--panel);
    border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);
    transition:transform .24s cubic-bezier(.2,.8,.2,1);z-index:41;display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer .dhead{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
  .drawer .dhead .t{font-weight:700;font-size:15px} .drawer .dbody{overflow:auto;padding:16px 18px}
  .dsec{margin-bottom:18px} .dsec h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--muted);margin:0 0 8px}
  .drow{display:grid;grid-template-columns:130px 1fr;gap:10px;padding:5px 0;border-bottom:1px dashed var(--border);font-size:13px}
  .drow .dk{color:var(--muted)} .drow .dv{word-break:break-word}
  .taglist{display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--panel2);border:1px solid var(--border);
    border-radius:6px;padding:2px 8px;font:11px var(--mono)}
  /* toast + palette + dialog */
  #toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:8px;padding:10px 14px;box-shadow:var(--shadow);animation:fade .2s;font-size:13px;max-width:340px}
  .toast.err{border-left-color:var(--crit)} .toast.ok{border-left-color:var(--ok)}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:14px;
    padding:22px;width:min(480px,94vw);box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  dialog label{display:block;margin:12px 0 5px;color:var(--muted);font-size:12px}
  dialog input[type=text],dialog input[type=number],dialog select{width:100%}
  .check{display:flex;align-items:center;gap:9px;margin:9px 0}.check input{width:auto}
  #palette{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;
    background:rgba(0,0,0,.5);z-index:70;padding-top:12vh}
  #palette.on{display:flex}
  .palbox{width:min(560px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);overflow:hidden}
  .palbox input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px}
  .palresults{max-height:340px;overflow:auto}
  .palitem{padding:10px 16px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .palitem.sel,.palitem:hover{background:var(--panel3)} .palitem .hint{margin-left:auto;color:var(--faint);font-size:12px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  iframe.preview{width:100%;height:520px;border:1px solid var(--border);border-radius:10px;background:#fff}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;font-size:12px}
  .legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .add{color:var(--ok)}.rem{color:var(--crit)} .diffcol h2{margin-top:8px}
  .copy{cursor:pointer;color:var(--muted);font-size:11px;margin-left:6px}.copy:hover{color:var(--accent)}
</style>
<style id="premium">
  /* ===================== premium override layer ===================== */
  :root{
    --bg:#080b11; --panel:#0f1420; --panel2:#141a28; --panel3:#1b2334; --border:#222c40;
    --fg:#e6eaf2; --muted:#8b95ac; --faint:#5b6479; --accent:#5aa2ff; --accent2:#9b6bff;
    --ok:#37e0a6; --shadow:0 18px 50px -12px rgba(0,0,0,.65); --radius:14px;
    --grad:linear-gradient(120deg,var(--accent),var(--accent2));
    --ring:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);
  }
  :root[data-theme="light"]{
    --bg:#eef2f9; --panel:#ffffff; --panel2:#f3f6fc; --panel3:#e9eff8; --border:#dfe6f1;
    --fg:#0f1729; --muted:#5a6478; --faint:#8a94a8; --accent:#2f6fe0; --accent2:#7a4bff;
    --shadow:0 18px 50px -14px rgba(30,45,80,.22);
  }
  body{background:
    radial-gradient(1100px 520px at 82% -8%, color-mix(in srgb,var(--accent2) 16%,transparent), transparent 60%),
    radial-gradient(900px 480px at -6% 4%, color-mix(in srgb,var(--accent) 13%,transparent), transparent 55%),
    var(--bg);
    -webkit-font-smoothing:antialiased;letter-spacing:.1px}
  ::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--border)}
  /* header — glass */

  /* sidebar */
  nav{background:color-mix(in srgb,var(--panel) 60%,transparent);backdrop-filter:blur(8px)}

  nav a svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;opacity:.85}
  nav a.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 20%,transparent),transparent);
    color:#fff;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
  nav a.active::before{content:"";position:absolute;left:-2px;top:18%;bottom:18%;width:3px;border-radius:3px;background:var(--grad)}
  nav a.active svg{opacity:1;color:var(--accent)}
  nav a .badge{background:var(--panel3);border-radius:999px;padding:1px 8px;font-weight:600}
  nav a .ic{display:none}
  /* headings */
  h1{font-weight:800;letter-spacing:-.02em;font-size:22px}
  h2{color:var(--faint)}
  /* cards + risk hero */
  .card{border-radius:var(--radius);background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,#fff 3%),var(--panel));
    box-shadow:var(--shadow);transition:.18s} .card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
  .card .v{letter-spacing:-.02em}
  .riskhero{border-radius:18px;background:
    radial-gradient(120% 160% at 0% 0%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 45%),
    linear-gradient(180deg,color-mix(in srgb,var(--panel) 90%,#fff 4%),var(--panel));
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .riskbadge{border-radius:12px;box-shadow:0 10px 30px -10px currentColor;position:relative}
  .riskbadge::after{content:"";position:absolute;inset:0;border-radius:12px;
    box-shadow:0 0 0 1px color-mix(in srgb,#fff 30%,transparent) inset}
  /* pills + tags */
  .pill{border:1px solid color-mix(in srgb,currentColor 22%,transparent);font-weight:700}
  .tag{background:var(--panel3);border-radius:8px}
  /* tables */
  table{border-radius:12px;overflow:hidden;border:1px solid var(--border);background:color-mix(in srgb,var(--panel) 70%,transparent)}
  th{background:color-mix(in srgb,var(--panel3) 80%,transparent);border-bottom:1px solid var(--border);backdrop-filter:blur(6px)}
  td{border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
  tbody tr{transition:background .12s} tbody tr:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
  tbody tr.clickable:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  code{color:color-mix(in srgb,var(--accent) 78%,var(--fg))}
  /* finding cards */
  .finding{background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 94%,#fff 2%),var(--panel));
    border-radius:12px;box-shadow:0 6px 18px -12px rgba(0,0,0,.6);transition:.15s}
  .finding:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--border))}
  .finding>.head{padding:12px 15px}
  .evi{border-radius:10px;background:color-mix(in srgb,var(--panel3) 60%,transparent)}
  /* chips */
  .chip{border-radius:999px;transition:.14s} .chip:hover{border-color:var(--accent);color:var(--fg)}
  /* drawer + dialog + palette — glass + spring */
  .drawer{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(20px) saturate(1.3);
    border-left:1px solid color-mix(in srgb,var(--accent) 18%,var(--border))}
  .drawer .dhead{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent)}
  .drawer .dhead .t{font-weight:800;letter-spacing:-.01em}
  .drow{grid-template-columns:120px 1fr} .drow .dk{font-weight:600}
  dialog{border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  dialog::backdrop{backdrop-filter:blur(4px)}
  .palbox{border-radius:16px;box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 20%,var(--border))}
  .palitem.sel{box-shadow:inset 2px 0 0 var(--accent)}
  .toast{border-radius:12px;backdrop-filter:blur(10px)}
  /* progress */
  .bar{height:7px;border-radius:6px;box-shadow:inset 0 0 0 1px color-mix(in srgb,#fff 6%,transparent)}
  .bar>i{box-shadow:0 0 12px -2px var(--accent)}

  .shot{border-radius:12px;box-shadow:var(--shadow)}

  /* fancy empty */
  .empty .big{font-size:40px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.6}
  /* entrance animation */
  .fade{animation:rise .32s cubic-bezier(.2,.8,.2,1)}

  /* responsive: collapse sidebar labels on narrow screens */
  @media (max-width:860px){

  /* ===================== v0.4.0 explorers ===================== */

  .tlrow>.tlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlt{font:11.5px var(--mono);color:var(--faint)}

  @media (max-width:860px){.tlrow{grid-template-columns:62px minmax(0,1fr)}

  /* ===================== v0.5 UX layer ===================== */

<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>
<div class="app" id="app">
  <header>
    <button class="icon menu" id="menuBtn" data-i18n-title="menu" aria-controls="nav" aria-expanded="false">☰</button>
    <div class="brand">WEB<span>RECON</span></div>
    <div class="scan-switcher" id="scanSwitcherWrap">

        <span class="dot ok" id="switcherDot"></span>
        <span class="s-target" id="switcherLabel" data-i18n="selectScan">Select a scan</span>
        <span class="s-badge" id="switcherBadge">—</span>
        <span class="s-arrow" aria-hidden="true">▾</span>
      </button>
      <select id="scanSelect" style="display:none" data-i18n-title="selectScan"></select>
    </div>
    <div id="progress" class="prog" aria-live="polite"></div>
    <button id="cancelBtn" class="danger" hidden data-i18n="cancel">Cancel</button>
    <div class="spacer"></div>
    <span id="demoBadge" class="demo-badge" hidden data-i18n="demo.badge" data-i18n-title="demo.tip">Demo · read-only</span>
    <button class="icon" id="paletteBtn" data-i18n-title="palette">⌘K</button>
    <button class="icon" id="langBtn">VI</button>
    <button class="icon" id="themeBtn" data-i18n-title="theme">◐</button>
    <button class="primary" id="newScanBtn"><span aria-hidden="true">+</span> <span class="lbl" data-i18n="newScan">New Scan</span></button>
  </header>
  <nav id="nav" data-i18n-aria="navLabel"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="scrim" id="navScrim"></div>

<!-- detail drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" inert>
  <div class="dhead"><span class="t" id="drawerTitle"></span><div class="spacer" style="flex:1"></div>
    <button class="icon" id="drawerClose" data-i18n-title="close">✕</button></div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<!-- new scan dialog -->
<dialog id="scanDialog" aria-labelledby="dlgTitle">
  <h1 id="dlgTitle" style="margin:0 0 2px" data-i18n="dlg.title">New Scan</h1>
  <div class="sub" data-i18n="dlg.sub">Only scan assets you own or are authorized to test.</div>

/* ============================ helpers ============================ */
const $ = s => document.querySelector(s);
const el = (t,a={},...k)=>{const n=document.createElement(t);
  for(const[x,v]of Object.entries(a)){if(v==null)continue;if(x==="class")n.className=v;else if(x==="html")n.innerHTML=v;
    else if(x.startsWith("on"))n.addEventListener(x.slice(2),v);else n.setAttribute(x,v);}
  for(const c of k)n.append(c==null?"":c.nodeType?c:document.createTextNode(String(c)));return n;};
async function api(p){
  const r=await fetch(p);
  if(!r.ok) throw new Error(`${r.status} ${p.split("?")[0].split("/").pop()}`);
  return r.json();
}
function toast(msg,type=""){const n=el("div",{class:"toast "+type},msg);$("#toasts").append(n);
  setTimeout(()=>{n.style.opacity="0";setTimeout(()=>n.remove(),300);},3400);}
/** make any element keyboard-activatable (Enter/Space) */
function clickable(node,fn,{role=true}={}){
  node.tabIndex=0;if(role)node.setAttribute("role","button");
  node.addEventListener("click",fn);
  node.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn(e);}});
  return node;
}
const riskColor=s=>({critical:"var(--crit)",high:"var(--high)",medium:"var(--med)",
  low:"var(--low)",informational:"var(--info)"})[s]||"var(--info)";
const SEVS=["critical","high","medium","low","informational"];
const sevPill=s=>el("span",{class:`pill ${s}`},s);
const METHOD_CLASS={GET:"m-get",POST:"m-post",PUT:"m-put",DELETE:"m-delete",PATCH:"m-patch"};
/** colored HTTP-method badge, shared across Endpoints / Attack Surface / Timeline / Auth Flow */
const methodBadge=m=>{const mu=String(m||"").toUpperCase();
  return mu?el("span",{class:"m-badge "+(METHOD_CLASS[mu]||"m-other")},mu):el("span",{class:"kv"},"\u2014");};
/** scan status → ok | warn (partial, unknown) | fail | run (still in progress) */
function statusKind(s){s=String(s||"");
  if(s==="success"||s==="done")return "ok";
  if(["failed","cancelled","timeout"].includes(s)||s.startsWith("error"))return "fail";
  if(["running","pending"].includes(s))return "run";
  return "warn";}
const pillCls=s=>({ok:"",fail:" bad",run:" warn",warn:" warn"})[statusKind(s)];
/** "YYYY-MM-DD HH:MM" in the viewer's local time (API timestamps are UTC). */
const fmtDate=s=>{
  if(!s)return "";const d=new Date(s);if(isNaN(d))return String(s).slice(0,16).replace("T"," ");
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;};
const uniq=a=>[...new Set(a.filter(x=>x!=null&&x!==""))].sort();
const fmtBytes=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
function hostOf(u){try{return new URL(u,location.href).hostname;}catch{return "";}}
function shortPath(u){try{const x=new URL(u,location.href);return x.pathname+(x.search||"");}catch{return u;}}
function card(k,v){return el("div",{class:"card"},el("div",{class:"k"},k),
  el("div",{class:"v",style:"font-size:19px"},v));}

const store={get(k){try{return localStorage.getItem(k);}catch{return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch{}}};
let LANG=store.get("wr-lang")||((navigator.language||"en").toLowerCase().startsWith("vi")?"vi":"en");
/** translate key, filling {placeholders} from vars */
function t(k,vars){
  let s=I18N[LANG]?.[k]??I18N.en[k]??k;
  if(vars)for(const[a,b]of Object.entries(vars))s=s.split(`{${a}}`).join(String(b));
  return s;
}
/** apply translations to static markup (data-i18n / -ph / -title) */
function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(n=>{n.textContent=t(n.dataset.i18n);});
  document.querySelectorAll("[data-i18n-ph]").forEach(n=>{n.placeholder=t(n.dataset.i18nPh);});
  document.querySelectorAll("[data-i18n-title]").forEach(n=>{
    n.title=t(n.dataset.i18nTitle);n.setAttribute("aria-label",t(n.dataset.i18nTitle));});
  // tooltip only (keeps a button's visible text as its accessible name)
  document.querySelectorAll("[data-i18n-tip]").forEach(n=>{n.title=t(n.dataset.i18nTip);});
  document.querySelectorAll("[data-i18n-aria]").forEach(n=>{n.setAttribute("aria-label",t(n.dataset.i18nAria));});
  const lb=$("#langBtn");lb.textContent=LANG==="vi"?"EN":"VI";lb.title=t("lang");lb.setAttribute("aria-label",t("lang"));
}
function setLang(l){LANG=l;store.set("wr-lang",l);applyStatic();renderNav();fillScanSelect();render();
  buildSearchIndex();}
const obs=o=>el("span",{class:"obs-"+o,title:I18N.en["obs."+o]?t("obs."+o):null},o);
function copyBtn(text){return clickable(el("span",{class:"copy",title:t("copy")},t("copy")),
  e=>{e.stopPropagation();navigator.clipboard?.writeText(text);toast(t("copied"),"ok");});}

/* ============================ state + routing ============================ */
const SECTIONS=[
  ["start",["Home"]],
  ["results",["Overview","AI Analysis","Findings"]],
  ["surface",["Attack Surface","Endpoints","JS Files","Auth Flow","Forms"]],
  ["inventory",["Technologies","Pages","Assets","DNS / TLS","Graph"]],
  ["history",["Timeline","Compare","Reports"]],
];
const FLATSECTIONS=SECTIONS.flatMap(([,items])=>items);
const slug=s=>s.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
const BYSLUG=Object.fromEntries(FLATSECTIONS.map(s=>[slug(s),s]));
const state={scanId:null,scans:[],section:"Home",ws:null,runningId:null,renderSeq:0,
  sevFilter:new Set(),catFilter:new Set(),confFilter:new Set(),secretsOnly:false,
  counts:{},searchIndex:[],readOnly:false};
const SID=()=>state.scanId;
function fromHash(){return BYSLUG[location.hash.replace(/^#\/?/,"")]||"Home";}
function go(section){const h="#/"+slug(section);if(location.hash===h)route();else location.hash=h;}
async function route(){
  state.section=fromHash();closeDrawer();closeNav(false);renderNav();
  await render();
  // renderNav() rebuilt the focused link; land keyboard/screen-reader users on the content
  if(!document.activeElement||document.activeElement===document.body)$("#main").focus({preventScroll:true});
}
addEventListener("hashchange",route);

/* ============================ theme ============================ */
const root=document.documentElement;
root.dataset.theme=store.get("wr-theme")||"dark";
$("#themeBtn").onclick=()=>{const th=root.dataset.theme==="dark"?"light":"dark";
  root.dataset.theme=th;store.set("wr-theme",th);};

let lastFocus=null;
function openDrawer(title,sections){
  lastFocus=document.activeElement;
  $("#drawerTitle").textContent=title;
  const body=$("#drawerBody");body.innerHTML="";
  for(const sec of sections){
    if(!sec) continue;
    const box=el("div",{class:"dsec"});if(sec.label)box.append(el("h3",{},sec.label));
    if(sec.rows){for(const[k,v]of sec.rows){ if(v==null||v==="") continue;
      box.append(el("div",{class:"drow"},el("span",{class:"dk"},k),el("span",{class:"dv"},v)));}}
    if(sec.tags){box.append(el("div",{class:"taglist"},...sec.tags.map(x=>el("span",{class:"tag"},x))));}
    if(sec.evidence){for(const e of sec.evidence)
      box.append(el("div",{class:"evi"},typeof e==="string"?e:JSON.stringify(e,null,2)));}
    if(sec.node)box.append(sec.node);
    if(sec.raw!==undefined){
      const pre=el("div",{class:"evi",style:"display:none"},JSON.stringify(sec.raw,null,2));
      const b=el("button",{class:"ghost",style:"font-size:12px;padding:4px 10px","aria-expanded":"false",
        onclick:()=>{const hid=pre.style.display==="none";pre.style.display=hid?"":"none";
          b.setAttribute("aria-expanded",String(hid));}},t("rawToggle"));
      box.append(b,pre);
    }
    body.append(box);
  }
  $("#scrim").classList.add("on");$("#drawer").classList.add("on");
  $("#drawer").inert=false;$("#drawer").setAttribute("aria-hidden","false");$("#drawerClose").focus();
}
function closeDrawer(){
  if(!$("#drawer").classList.contains("on"))return;
  $("#scrim").classList.remove("on");$("#drawer").classList.remove("on");
  $("#drawer").setAttribute("aria-hidden","true");$("#drawer").inert=true;
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus();
}
$("#drawerClose").onclick=closeDrawer;$("#scrim").onclick=closeDrawer;
addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDrawer();closePalette();closeNav();}
  if(e.key==="Tab"&&$("#drawer").classList.contains("on")){  // keep focus inside the drawer
    const f=[...$("#drawer").querySelectorAll('button,[href],input,select,[tabindex="0"]')]
      .filter(n=>n.offsetParent!==null);
    if(!f.length)return;const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});

/** empty state with an optional call to action {label, run} and hint */
function emptyState(msg=t("nothing"),action=null,hint=null){

  if(hint)n.append(el("div",{class:"hint"},hint));

function errorState(err,retry){

    el("div",{},t("error")),el("div",{class:"hint"},String(err?.message||err)));

function pageHead(title,sub,...actions){

function tbl(cols,rows){const tb=el("table");const h=el("tr");cols.forEach(c=>h.append(el("th",{scope:"col"},c)));
  tb.append(el("thead",{},h));const b=el("tbody");
  rows.forEach(r=>{const tr=el("tr");r.cells.forEach(c=>tr.append(el("td",{},c)));

function dataTable(main,data,cols,mapRow){

  main.append(el("div",{class:"toolbar"},inp));

/** labelled <select> filter; values are strings or [value,label]; returns [labelEl, selectEl] */
function selFilter(label,values,onchange){
  const opt=v=>Array.isArray(v)?el("option",{value:v[0]},v[1]):el("option",{value:v},v);
  const s=el("select",{onchange},el("option",{value:""},t("all")),...values.map(opt));
  return [el("label",{},label,s),s];

/** toggle chip bound to a Set; `color` is the "on" background */
function toggleChip(set,key,text,color,onchange){
  const chip=el("span",{class:"chip","aria-pressed":String(set.has(key))},text);
  const paint=()=>{chip.style.cssText=set.has(key)?`background:${color};color:#fff;border-color:transparent`:"";
    chip.setAttribute("aria-pressed",String(set.has(key)));};
  paint();
  return clickable(chip,()=>{set.has(key)?set.delete(key):set.add(key);paint();onchange();});
}

/* ============================ render ============================ */
async function render(){
  const m=$("#main");m.innerHTML="";const shell=el("div",{class:"fade"});m.append(shell);
  const sec=state.section,seq=++state.renderSeq;
  if(sec!=="Home"&&!state.scanId){
    shell.append(emptyState(t("needScan"),{label:"+ "+t("newScan"),run:()=>openScanDialog()}));return;}
  shell.append(skeleton());
  try{
    const node=await RENDER[sec]();
    if(seq!==state.renderSeq)return;  // a newer navigation won the race
    shell.innerHTML="";shell.append(node);
  }catch(e){
    if(seq!==state.renderSeq)return;
    shell.innerHTML="";shell.append(errorState(e,render));toast(t("loadFailed",{e:e.message}),"err");
  }
}

/** small percentage ring (confidence / coverage meter) */
function confRing(frac,color){
  frac=Math.max(0,Math.min(1,frac||0));
  const NS="http://www.w3.org/2000/svg",R=13,C=2*Math.PI*R;
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","kring");
  svg.setAttribute("width",34);svg.setAttribute("height",34);svg.setAttribute("viewBox","0 0 34 34");
  svg.setAttribute("role","img");svg.setAttribute("aria-label",Math.round(frac*100)+"%");
  const circle=(stroke,dash)=>{const c=document.createElementNS(NS,"circle");
    const a={cx:17,cy:17,r:R,fill:"none",stroke,"stroke-width":4};
    if(dash!=null)Object.assign(a,{"stroke-dasharray":`${dash} ${C}`,
      transform:"rotate(-90 17 17)","stroke-linecap":"round"});
    for(const[k,v]of Object.entries(a))c.setAttribute(k,v);return c;};
  svg.append(circle("var(--panel3)"),circle(color||"var(--accent)",frac*C));
  const tx=document.createElementNS(NS,"text");tx.setAttribute("x",17);tx.setAttribute("y",20.5);
  tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","9");tx.setAttribute("font-weight","700");
  tx.textContent=Math.round(frac*100)+"%";svg.append(tx);return svg;
}

/* ============================ graph ============================ */
/* Force-directed layout: repulsion between all nodes + springs along edges +
   gentle centering, then a collision pass so circles never overlap. Deterministic
   (golden-angle seed, no RNG) so the graph is stable across re-renders. */
function forceLayout(nodes,edges,W,H,radius){
  const cx=W/2,cy=H/2,N=nodes.length,P={},M=26;
  const deg={};for(const e of edges){deg[e.source]=(deg[e.source]||0)+1;deg[e.target]=(deg[e.target]||0)+1;}
  const hub=nodes.reduce((a,b)=>(deg[b.id]||0)>(deg[a.id]||0)?b:a,nodes[0]);
  nodes.forEach((n,i)=>{const a=i*2.399963267,r=20*Math.sqrt(i+0.5);
    P[n.id]={x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});
  if(hub)P[hub.id]={x:cx,y:cy};
  const E=edges.filter(e=>P[e.source]&&P[e.target]);
  const area=(W-2*M)*(H-2*M);
  const k=Math.min(160,1.15*Math.sqrt(area/(N+1)));
  const iters=N>160?140:320;
  let temp=(W-2*M)/6;
  const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
  for(let it=0;it<iters;it++){
    const dsp={};nodes.forEach(n=>dsp[n.id]={x:0,y:0});
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=P[nodes[i].id],b=P[nodes[j].id];
      let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.01,f=k*k/d;
      const ux=dx/d,uy=dy/d,A=dsp[nodes[i].id],B=dsp[nodes[j].id];
      A.x+=ux*f;A.y+=uy*f;B.x-=ux*f;B.y-=uy*f;}
    for(const e of E){
      const a=P[e.source],b=P[e.target];
      let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.01,f=d*d/k;
      const ux=dx/d,uy=dy/d;
      dsp[e.source].x-=ux*f;dsp[e.source].y-=uy*f;dsp[e.target].x+=ux*f;dsp[e.target].y+=uy*f;}
    for(const n of nodes){if(n===hub){P[n.id].x=cx;P[n.id].y=cy;continue;}
      const p=P[n.id],d=dsp[n.id];
      const m=Math.hypot(d.x,d.y)||0.01;
      p.x+=d.x/m*Math.min(m,temp);p.y+=d.y/m*Math.min(m,temp);
      p.x+=(cx-p.x)*0.01;p.y+=(cy-p.y)*0.01;
      p.x=clamp(p.x,M,W-M);p.y=clamp(p.y,M,H-M);}
    temp*=0.97;
  }
  for(let pass=0;pass<60;pass++){let moved=false;
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=P[nodes[i].id],b=P[nodes[j].id];
      const min=radius(nodes[i])+radius(nodes[j])+8;
      let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||0.01;
      if(d<min){const s=(min-d)/2,ux=dx/d,uy=dy/d;
        a.x=clamp(a.x+ux*s,M,W-M);a.y=clamp(a.y+uy*s,M,H-M);
        b.x=clamp(b.x-ux*s,M,W-M);b.y=clamp(b.y-uy*s,M,H-M);moved=true;}}
    if(!moved)break;}
  const out={};for(const n of nodes)out[n.id]=[P[n.id].x,P[n.id].y];return out;
}
const NODE_COLOR={domain:"#4da3ff",ip:"#22c3ee",technology:"#7c5cff",endpoint:"#3ddc97",page:"#94a3b8",
  asset:"#a78bfa",form:"#f472b6",dns:"#f2c14e",certificate:"#ff784e",finding:"#ff4d6d"};
async function graphView(){
  const g=await api(`/api/scans/${SID()}/graph`);const w=el("div");
  w.append(pageHead(t("gr.title"),t("gr.hint")));
  if(!g.nodes.length){w.append(emptyState(t("gr.none")));return w;}
  const present=new Set(g.nodes.map(n=>n.type));
  const legend=el("div",{class:"legend"});
  for(const[k,v]of Object.entries(NODE_COLOR))if(present.has(k))
    legend.append(el("span",{},el("b",{style:`background:${v}`}),k));
  w.append(legend);
  const W=Math.max(300,Math.min($("#main").clientWidth-40,980)),H=W<600?420:560,NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");svg.setAttribute("width",W);svg.setAttribute("height",H);
  svg.setAttribute("role","img");svg.setAttribute("aria-label",t("gr.title"));
  svg.style.cssText="border:1px solid var(--border);border-radius:12px;background:var(--panel);"+
    "cursor:grab;touch-action:none;display:block;max-width:100%";
  const rootG=document.createElementNS(NS,"g");svg.append(rootG);
  const deg={};for(const e of g.edges){deg[e.source]=(deg[e.source]||0)+1;deg[e.target]=(deg[e.target]||0)+1;}
  const radius=n=>n.type==="domain"?11:Math.min(10,4.5+(deg[n.id]||0)*0.7);
  const pos=forceLayout(g.nodes,g.edges,W,H,radius);
  for(const e of g.edges){const a=pos[e.source],b=pos[e.target];if(!a||!b)continue;
    const l=document.createElementNS(NS,"line");
    for(const[k,v]of Object.entries({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"var(--border)","stroke-width":0.8}))
      l.setAttribute(k,v);rootG.append(l);}
  const labelDeg=[...g.nodes].map(n=>deg[n.id]||0).sort((a,b)=>b-a);
  const labelCut=labelDeg[Math.min(labelDeg.length-1,14)]||0;
  const maxDeg=Math.max(...Object.values(deg),0);
  for(const n of g.nodes){const p=pos[n.id];if(!p)continue;const[x,y]=p;
    const c=document.createElementNS(NS,"circle");
    for(const[k,v]of Object.entries({cx:x,cy:y,r:radius(n),fill:NODE_COLOR[n.type]||"#8a93a6",
      stroke:"var(--panel)","stroke-width":1.5}))c.setAttribute(k,v);
    c.style.cursor="pointer";
    const tt=document.createElementNS(NS,"title");tt.textContent=`${n.type}: ${n.label}`;c.append(tt);
    c.addEventListener("click",ev=>{ev.stopPropagation();
      const nbrs=g.edges.filter(e=>e.source===n.id||e.target===n.id)
        .map(e=>e.source===n.id?e.target:e.source);
      openDrawer(n.label||n.id,[
        {label:t("d.node"),rows:[[t("d.type"),n.type],[t("d.label"),n.label||"—"],
          [t("d.connections"),String(deg[n.id]||0)]]},
        {label:t("d.neighbors"),tags:[...new Set(nbrs)].slice(0,40)},
        {label:t("d.raw"),raw:n}]);});
    rootG.append(c);
    const isHub=n.type==="domain"||(deg[n.id]||0)===maxDeg;
    if(isHub||(deg[n.id]||0)>=Math.max(2,labelCut)){
      const tx=document.createElementNS(NS,"text");
      if(isHub){tx.setAttribute("x",x);tx.setAttribute("y",y+radius(n)+14);
        tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","11.5");}
      else{tx.setAttribute("x",x+radius(n)+4);tx.setAttribute("y",y+3.5);tx.setAttribute("font-size","10");}
      tx.style.cssText="pointer-events:none;paint-order:stroke;stroke:var(--panel);"+
        "stroke-width:3.5px;stroke-linejoin:round;font-weight:600";
      tx.textContent=(n.label||"").slice(0,36);rootG.append(tx);}}
  const XS=g.nodes.map(n=>pos[n.id]?.[0]).filter(v=>v!=null);
  const YS=g.nodes.map(n=>pos[n.id]?.[1]).filter(v=>v!=null);
  const view={x:0,y:0,k:1};
  if(XS.length){const minX=Math.min(...XS),maxX=Math.max(...XS),
    minY=Math.min(...YS),maxY=Math.max(...YS),pad=48,
    bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY);
    view.k=Math.max(.4,Math.min((W-2*pad)/bw,(H-2*pad)/bh,2.4));
    view.x=pad-minX*view.k+(W-2*pad-bw*view.k)/2;
    view.y=pad-minY*view.k+(H-2*pad-bh*view.k)/2;}
  function apply(){rootG.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`);}
  apply();
  svg.addEventListener("wheel",ev=>{ev.preventDefault();
    const r=svg.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
    const f=ev.deltaY<0?1.12:1/1.12,nk=Math.min(6,Math.max(.3,view.k*f));
    view.x=mx-(mx-view.x)*(nk/view.k);view.y=my-(my-view.y)*(nk/view.k);view.k=nk;apply();},{passive:false});
  let drag=null;
  svg.addEventListener("pointerdown",ev=>{if(ev.target.tagName==="circle")return;
    drag={x:ev.clientX-view.x,y:ev.clientY-view.y};
    svg.style.cursor="grabbing";svg.setPointerCapture(ev.pointerId);});
  svg.addEventListener("pointermove",ev=>{if(!drag)return;
    view.x=ev.clientX-drag.x;view.y=ev.clientY-drag.y;apply();});
  svg.addEventListener("pointerup",ev=>{drag=null;svg.style.cursor="grab";
    try{svg.releasePointerCapture(ev.pointerId);}catch{}});
  w.append(svg);return w;
}

  const opts=r.groq_available?[["groq","Groq"],["stub",t("ai.stub")]]:[["stub",t("ai.stub")]];
  const prov=el("select",{"aria-label":t("ai.provider")},...opts.map(([v,l])=>el("option",{value:v},l)));
  const btn=el("button",{class:"primary ai-run",onclick:run},r.analysis?t("ai.rerun"):t("ai.run"));
  const bar=el("div",{class:"toolbar"},el("span",{class:"sub"},t("ai.provider")),prov,btn);
  if(!r.groq_available)bar.append(el("span",{class:"kv"},t("ai.noKey")));
  w.append(bar);
  const out=el("div",{"aria-live":"polite"});w.append(out);
  if(r.analysis)renderAi(out,r.analysis);
  else if(r.running){out.append(emptyState(t("ai.bg")));
    aiPoll=setTimeout(()=>{if(state.section==="AI Analysis"&&SID()===sid)render();},3000);}
  else out.append(emptyState(t("ai.none"),{label:t("ai.run"),run},t("ai.noneHint")));
  async function run(){
    if(state.readOnly){toast(t("demo.blocked"),"err");return;}
    btn.disabled=true;btn.textContent=t("ai.running");out.innerHTML="";out.append(skeleton(6));
    try{
      const res=await fetch(`/api/scans/${sid}/ai?provider=${encodeURIComponent(prov.value)}`,{method:"POST"});
      const j=await res.json();if(!res.ok)throw new Error(j.detail||String(res.status));
      out.innerHTML="";renderAi(out,j.analysis);toast(t("ai.done"),"ok");btn.textContent=t("ai.rerun");
      refreshCounts();
    }catch(e){out.innerHTML="";out.append(errorState(e,run));
      toast(t("ai.failed"),"err");btn.textContent=t("ai.run");}
    finally{btn.disabled=false;}
  }
  return w;
}
function renderAi(out,a){
  const ev=a.evidence||{};
  const chips=ids=>el("span",{class:"evchips"},...ids.map(id=>clickable(el("span",{class:"evchip",
    title:ev[id]?.summary||id},id),()=>evidenceDrawer(id,ev[id]))));
  out.append(el("div",{class:"sub",style:"margin-bottom:8px"},
    `${a.provider} · ${a.model} · ${fmtDate(a.created_at)}`+
    (a.rejected_claims?` · ${t("ai.dropped",{n:a.rejected_claims})}`:"")));
  if(a.app_summary)out.append(el("div",{class:"riskhero"},el("div",{},
    el("div",{class:"kv",style:"text-transform:uppercase;letter-spacing:.06em;font-size:11px"},t("ai.what")),
    el("div",{style:"font-size:15px;margin-top:4px"},a.app_summary.text," ",chips(a.app_summary.evidence)))));
  for(const k of AI_SECTIONS){
    const cl=a.sections?.[k]||[];out.append(el("h2",{},t("ai.s."+k)));
    if(!cl.length){out.append(el("div",{class:"sub"},t("ai.nothing")));continue;}
    out.append(el("ul",{class:"claims"},...cl.map(c=>el("li",{},c.text," ",chips(c.evidence)))));
  }
}
function evidenceDrawer(id,item){
  if(!item){openDrawer(id,[{label:t("d.evidence"),rows:[["ID",id],[t("d.status"),t("d.notInSnap")]]}]);return;}
  openDrawer(`${id} · ${item.kind}`,[
    {label:t("d.evidence"),rows:[["ID",id],[t("d.kind"),item.kind],[t("d.summary"),item.summary]]},
    {label:t("d.data"),evidence:[item.data||{}],
      node:item.kind==="finding"?el("button",{class:"ghost",style:"margin-top:8px",
        onclick:()=>{closeDrawer();go("Findings");}},t("openFindings")):null}]);
}
/* ============================ scans + progress ============================ */
function fillScanSelect(){
  const sel=$("#scanSelect");if(sel)sel.innerHTML="";
  const trigTarget=$("#switcherLabel"), trigBadge=$("#switcherBadge"), trigDot=$("#switcherDot");
  if(!state.scans.length){
    if(sel){sel.append(el("option",{value:""},t("noScans")));sel.disabled=true;}
    if(trigTarget) trigTarget.textContent=t("noScans");
    if(trigBadge) trigBadge.textContent="—";
    return;
  }
  if(sel){
    sel.disabled=false;
    for(const s of state.scans)sel.append(el("option",{value:s.id},
      `${s.target}  ·  ${s.status}  ·  ${t("selFindings",{n:s.findings})}  ·  ${fmtDate(s.created_at)}`));
    sel.value=state.scanId||"";
  }
  const cur=state.scans.find(s=>s.id===state.scanId)||state.scans[0];
  if(cur){
    if(trigTarget) trigTarget.textContent=cur.target;
    if(trigBadge) trigBadge.textContent=t("selFindings",{n:cur.findings});
    if(trigDot) trigDot.className=`dot ${statusKind(cur.status)}`;
  }
}
async function loadScans(keep=true){
  state.scans=await api("/api/scans");
  if(!state.scans.length)state.scanId=null;
  else if(!keep||!state.scans.find(s=>s.id===state.scanId)){
    const saved=store.get("wr-scan");
    state.scanId=(state.scans.find(s=>s.id===saved)||state.scans[0]).id;
  }
  fillScanSelect();
  return state.scans;
}
function resetFilters(){
  state.sevFilter.clear();state.catFilter.clear();state.confFilter.clear();state.secretsOnly=false;}
function selectScan(id){
  state.scanId=id;store.set("wr-scan",id);
  const sel=$("#scanSelect");if(sel)sel.value=id;
  fillScanSelect();resetFilters();
  refreshCounts().then(render);
}
$("#scanSelect")&&( $("#scanSelect").onchange=e=>selectScan(e.target.value) );

/* Quick Switcher Modal Logic */
let switcherSel=0;
function openSwitcherModal(){
  const modal=$("#switcherModal"), inp=$("#switcherInput");
  if(!modal||!state.scans.length)return;
  inp.value="";
  renderSwitcherList("");
  modal.showModal();
  $("#switcherTrigger").setAttribute("aria-expanded","true");
  inp.focus();
}
/* Reset trigger state synchronously on every way out (click, pick, Esc, backdrop). */
function switcherClosed(){
  const tr=$("#switcherTrigger");tr.setAttribute("aria-expanded","false");tr.focus();}
function closeSwitcherModal(){ const m=$("#switcherModal");if(m?.open){m.close();switcherClosed();} }
$("#switcherModal")?.addEventListener("cancel",switcherClosed);  // Esc
$("#switcherModal")?.addEventListener("close",()=>{   // any other way the dialog closes
  if($("#switcherTrigger").getAttribute("aria-expanded")==="true")switcherClosed();});
/* Arrow keys move the highlight, Enter opens it — same model as the command palette. */
$("#switcherInput")?.addEventListener("keydown",e=>{
  const opts=[...document.querySelectorAll("#switcherList .switcher-opt")];
  if(!opts.length)return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    e.preventDefault();
    switcherSel=Math.max(0,Math.min(opts.length-1,switcherSel+(e.key==="ArrowDown"?1:-1)));
    opts.forEach((o,i)=>o.classList.toggle("selected",i===switcherSel));
    opts[switcherSel].scrollIntoView({block:"nearest"});
  }else if(e.key==="Enter"){e.preventDefault();opts[switcherSel]?.click();}
});
$("#switcherTrigger")&&( $("#switcherTrigger").onclick=openSwitcherModal );
$("#switcherClose")&&( $("#switcherClose").onclick=closeSwitcherModal );
$("#switcherInput")&&( $("#switcherInput").oninput=e=>renderSwitcherList(e.target.value) );
$("#switcherModal")&&( $("#switcherModal").onclick=e=>{if(e.target===$("#switcherModal"))closeSwitcherModal();} );

function renderSwitcherList(filter=""){
  const list=$("#switcherList");if(!list)return;
  list.innerHTML="";
  const q=filter.toLowerCase();
  const filtered=state.scans.filter(s=>!q||`${s.target} ${s.status} ${fmtDate(s.created_at)}`
    .toLowerCase().includes(q));
  const curIdx=filtered.findIndex(s=>s.id===state.scanId);
  switcherSel=curIdx>=0?curIdx:0;
  if(!filtered.length){
    list.append(emptyState(t("noMatch")));
    return;
  }
  filtered.forEach((s,i)=>{
    const isCur=s.id===state.scanId;
    const opt=el("button",{type:"button",class:"switcher-opt"+(i===switcherSel?" selected":""),
      "aria-current":isCur?"true":null},
      el("span",{class:`dot ${statusKind(s.status)}`}),
      el("div",{class:"s-info"},
        el("div",{class:"s-title"},s.target),
        el("div",{class:"s-meta"},
          el("span",{class:"pill "+({ok:"low",fail:"high",run:"medium",warn:"medium"})[statusKind(s.status)]},s.status),
          el("span",{},`• ${t("selFindings",{n:s.findings})}`),
          el("span",{},`• ${fmtDate(s.created_at)}`)
        )
      )
    );
    opt.onclick=()=>{
      selectScan(s.id);
      closeSwitcherModal();
    };
    const del=el("button",{type:"button",class:"switcher-del","data-i18n-title":"del.title",
      title:t("del.title"),"aria-label":t("del.title")},"\u{1F5D1}");
    let armed=false,armTimer=null;
    del.onclick=ev=>{
      ev.stopPropagation();
      if(!armed){  // first click arms, second within 3s confirms
        armed=true;del.classList.add("confirm");del.textContent=t("del.confirm");
        clearTimeout(armTimer);
        armTimer=setTimeout(()=>{armed=false;del.classList.remove("confirm");
          del.textContent="\u{1F5D1}";},3000);
        return;
      }
      clearTimeout(armTimer);deleteScan(s.id);
    };
    list.append(el("div",{class:"switcher-row"},opt,del));
  });
}
async function deleteScan(id){
  try{
    const res=await fetch(`/api/scans/${id}`,{method:"DELETE"});
    if(!res.ok){
      const j=await res.json().catch(()=>({}));
      throw new Error(res.status===409?t("del.running"):(j.detail||res.status));
    }
    toast(t("del.done"),"ok");
    const wasCurrent=id===state.scanId;
    await loadScans(!wasCurrent);
    if(wasCurrent){
      state.scanId=state.scans[0]?.id||null;
      if(state.scanId)store.set("wr-scan",state.scanId);
    }
    fillScanSelect();
    if(!state.scans.length){closeSwitcherModal();renderNav();render();return;}
    renderSwitcherList($("#switcherInput")?.value||"");
    refreshCounts().then(render);
  }catch(e){toast(t("del.fail",{e:e.message}),"err");}
}

async function refreshCounts(){
  state.counts={};
  const sid=SID();
  if(sid){
    const [o,eps,js]=await Promise.all([api(`/api/scans/${sid}`).catch(()=>null),
      api(`/api/scans/${sid}/endpoints`).catch(()=>null),api(`/api/scans/${sid}/js`).catch(()=>null)]);
    if(SID()!==sid)return;  // scan switched while loading
    if(o){state.counts.Findings=o.total_findings;state.counts.Technologies=o.technologies.length;}
    if(eps)state.counts.Endpoints=eps.length;
    if(js)state.counts["JS Files"]=js.length;
  }
  renderNav();
  buildSearchIndex();
}
/* Build a lightweight cross-section index the command palette searches. */
async function buildSearchIndex(){
  const sid=SID();if(!sid){state.searchIndex=[];return;}
  const idx=[];
  const grab=async(path,section,map)=>{
    try{for(const r of await api(`/api/scans/${sid}/${path}`))idx.push({...map(r),section});}catch{}
  };
  await Promise.all([
    grab("findings","Findings",f=>({label:f.name,hint:`${t("hint.finding")} · ${f.severity}`,text:`${f.name} ${f.check_id} ${f.category||""}`})),
    grab("endpoints","Endpoints",e=>({label:e.url,hint:`${t("hint.endpoint")} · ${e.method||"?"}`,text:e.url})),
    grab("technologies","Technologies",x=>({label:x.name,hint:t("hint.technology"),text:`${x.name} ${x.category||""}`})),
    grab("pages","Pages",p=>({label:p.title||p.url,hint:t("hint.page"),text:`${p.title||""} ${p.url}`})),
    grab("js","JS Files",x=>({label:x.url,hint:t("hint.script"),text:`${x.url} ${x.sha256||""}`})),
  ]);
  if(SID()===sid)state.searchIndex=idx;
}

/* ---- new scan dialog ---- */
function openScanDialog(prefill={}){
  if(state.readOnly){toast(t("demo.blocked"),"err");return;}
  if(prefill.url)$("#f_url").value=prefill.url;
  $("#f_authBox").open=!!prefill.auth;
  $("#f_err").textContent="";
  $("#scanDialog").showModal();
  (prefill.auth?$("#f_login_url"):$("#f_url")).focus();
}
/** accept "example.com" (→ https://), reject anything that is not http(s) */
function normalizeTarget(raw){
  let v=(raw||"").trim();if(!v)return null;
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v))v="https://"+v;
  try{const u=new URL(v);return /^https?:$/.test(u.protocol)&&u.hostname?u.href:null;}catch{return null;}
}
$("#newScanBtn").onclick=()=>openScanDialog();
$("#cancelDialog").onclick=()=>$("#scanDialog").close();
$("#f_url").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("#startScanBtn").click();}});
$("#startScanBtn").onclick=async()=>{
  const url=normalizeTarget($("#f_url").value);
  if(!url){$("#f_err").textContent=t("dlg.badUrl");$("#f_url").focus();return;}
  $("#f_err").textContent="";
  const headers=($("#f_headers").value||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const num=(id,d)=>{const v=parseInt($(id).value,10);return Number.isFinite(v)&&v>=0?v:d;};
  const body={url,depth:num("#f_depth",3),max_pages:Math.max(1,num("#f_pages",300)),
    browser:$("#f_browser").checked,allow_private:$("#f_private").checked,
    active:$("#f_active").checked,probe:$("#f_probe").checked,scope_mode:$("#f_scope").value,
    cookie:$("#f_cookie").value.trim()||null,headers,
    login_url:$("#f_login_url").value.trim()||null,
    login_user:$("#f_login_user").value.trim()||null,
    login_pass:$("#f_login_pass").value||null,ai:$("#f_ai").checked};
  const btn=$("#startScanBtn");btn.disabled=true;
  try{
    const res=await fetch("/api/scans",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify(body)});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(j.detail||String(res.status));
    $("#scanDialog").close();
    $("#f_login_pass").value="";  // never keep the password around in the form
    toast(t("dlg.started"),"ok");watch(j.scan_id);
  }catch(e){$("#f_err").textContent=t("dlg.startFail",{e:e.message});}
  finally{btn.disabled=false;}
};
$("#cancelBtn").onclick=()=>{ if(state.runningId){fetch(`/api/scans/${state.runningId}/cancel`,{method:"POST"});
  toast(t("prog.cancelling"));}};
let progTimer=null;
const doneLabel=s=>s==="done"?t("prog.finished"):String(s).startsWith("error")?t("prog.failed"):s;
function watch(scanId){
  clearTimeout(progTimer);  // a previous scan's "clear the bar in 4s" must not wipe this one
  let done=false;
  state.runningId=scanId;$("#cancelBtn").hidden=false;
  const prog=$("#progress"),bar=el("i"),wrap=el("span",{class:"bar"},bar),
    label=el("span",{class:"lbl"},t("prog.starting"));
  prog.innerHTML="";prog.append(el("span",{class:"dot run"}),wrap,label);
  if(state.ws)state.ws.close();
  const ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/api/scans/${scanId}/events`);
  state.ws=ws;
  ws.onmessage=m=>{const ev=JSON.parse(m.data);
    if(ev.module==="_done"){done=true;bar.style.width="100%";label.textContent=doneLabel(ev.status);
      const dot=prog.querySelector(".dot");if(dot)dot.className="dot "+(ev.status==="done"?"ok":"fail");
      $("#cancelBtn").hidden=true;state.runningId=null;
      toast(t("prog.done",{s:doneLabel(ev.status)}),ev.status==="done"?"ok":"err");
      ws.close();
      loadScans().then(()=>{if(state.scans.find(s=>s.id===scanId)){state.scanId=scanId;store.set("wr-scan",scanId);
        resetFilters();fillScanSelect();}
        refreshCounts().then(()=>go("Home"));});
      progTimer=setTimeout(()=>{prog.innerHTML="";},4000);return;}
    const pct=ev.total?Math.round((ev.index+1)/ev.total*100):0;
    bar.style.width=pct+"%";label.textContent=t("prog.running",{m:ev.module,i:ev.index+1,n:ev.total});};
  ws.onerror=()=>{prog.querySelector(".dot")?.classList.add("fail");};
  ws.onclose=()=>{  // server restart / network drop before `_done`: don't leave the UI "running"
    if(done||state.ws!==ws)return;
    prog.querySelector(".dot")?.classList.add("fail");label.textContent=t("prog.failed");
    $("#cancelBtn").hidden=true;state.runningId=null;toast(t("prog.lost"),"err");
    progTimer=setTimeout(()=>{prog.innerHTML="";},6000);
  };
}

/* ============================ command palette ============================ */
const PAL=$("#palette"),PALIN=$("#palInput"),PALRES=$("#palResults");let palSel=0,palItems=[],palPrev=null;
function openPalette(){closeSwitcherModal();palPrev=document.activeElement;buildPalette("");PAL.classList.add("on");PALIN.value="";PALIN.focus();}
function closePalette(){if(!PAL.classList.contains("on"))return;PAL.classList.remove("on");palPrev?.focus?.();}
$("#paletteBtn").onclick=openPalette;
addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();}});
function buildPalette(q){
  const actions=[
    ...FLATSECTIONS.map(s=>({label:t("pal.goto",{s:t("sec."+s)}),hint:t("pal.section"),run:()=>go(s)})),
    ...(state.readOnly?[]:[{label:t("newScan"),hint:t("pal.action"),run:()=>openScanDialog()}]),
    {label:t("x.title")+"…",hint:t("pal.action"),run:()=>$("#exportDialog").showModal()},
    {label:t("theme"),hint:t("pal.action"),run:()=>$("#themeBtn").click()},
    {label:t("lang"),hint:t("pal.action"),run:()=>$("#langBtn").click()},
  ];
  const ql=q.toLowerCase();
  let items=actions.filter(a=>a.label.toLowerCase().includes(ql));
  if(ql){
    const hits=state.searchIndex
      .filter(d=>(d.text||d.label||"").toLowerCase().includes(ql))
      .slice(0,40)
      .map(d=>({label:d.label,hint:d.hint,run:()=>go(d.section)}));
    items=items.concat(hits);
  }
  palItems=items.slice(0,60);palSel=0;drawPalette();
}
function drawPalette(){PALRES.innerHTML="";palItems.forEach((a,i)=>{
  PALRES.append(el("div",{class:"palitem"+(i===palSel?" sel":""),role:"option","aria-selected":String(i===palSel),
    onclick:()=>{closePalette();a.run();}},a.label,el("span",{class:"hint"},a.hint)));});
  PALRES.querySelector(".sel")?.scrollIntoView({block:"nearest"});}
PALIN.oninput=()=>buildPalette(PALIN.value);
PALIN.onkeydown=e=>{
  if(e.key==="ArrowDown"){palSel=Math.min(palSel+1,palItems.length-1);drawPalette();e.preventDefault();}
  else if(e.key==="ArrowUp"){palSel=Math.max(palSel-1,0);drawPalette();e.preventDefault();}
  else if(e.key==="Enter"){const a=palItems[palSel];if(a){closePalette();a.run();}}
};
PAL.onclick=e=>{if(e.target===PAL)closePalette();};

/* ============================ boot ============================ */
async function applyMeta(){
  try{
    const m=await api("/api/meta");
    state.readOnly=!!m.read_only;
  }catch{/* older server without /api/meta: treat as writable */}
  document.body.classList.toggle("ro",state.readOnly);
  const badge=$("#demoBadge");if(badge)badge.hidden=!state.readOnly;
}
applyStatic();
syncNavInert();
state.section=fromHash();
renderNav();
applyMeta()
  .then(()=>loadScans()).then(()=>refreshCounts()).then(render)
  .catch(e=>{$("#main").innerHTML="";$("#main").append(errorState(e,()=>location.reload()));});
</script>
